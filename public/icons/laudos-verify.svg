<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" role="img" aria-hidden="true">
  <defs>
    <radialGradient id="lens" cx="42%" cy="38%" r="58%">
      <stop offset="0%" stop-color="#F0F9FF"/>
      <stop offset="55%" stop-color="#93C5FD"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </radialGradient>
    <linearGradient id="rim" x1="12" y1="8" x2="48" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="1.2" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Cabo da lupa -->
  <rect x="40.5" y="41" width="7" height="18" rx="3.5" transform="rotate(42 44 50)" fill="url(#rim)" stroke="#1E3A8A" stroke-width="1.2"/>

  <!-- Lente -->
  <circle cx="28" cy="28" r="16.5" fill="url(#lens)" stroke="url(#rim)" stroke-width="4.5" filter="url(#glow)"/>
  <circle cx="28" cy="28" r="16.5" fill="none" stroke="#1E3A8A" stroke-width="1.1" opacity="0.85"/>

  <!-- Documento -->
  <path fill="#F8FBFF" stroke="#1E3A8A" stroke-width="1.35" stroke-linejoin="round"
    d="M20.2 16.2 h10.2 l4.4 4.4 v18.2 H20.2 Z"/>
  <path fill="#BFDBFE" stroke="#1E3A8A" stroke-width="1" stroke-linejoin="round"
    d="M30.4 16.2 v4.4 h4.4 Z"/>
  <rect x="23" y="24.2" width="8.2" height="1.6" rx="0.6" fill="#1E3A8A"/>
  <path fill="none" stroke="#1E3A8A" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"
    d="M24.2 32.8 l3.1 3.1 6.4-7"/>

  <!-- Selo -->
  <g transform="translate(40.5 40.5)">
    <path fill="#93C5FD" stroke="#1E3A8A" stroke-width="1.05"
      d="M0-8.2 L2.1-6.4 L4.8-7 L5.2-4.2 L7.8-3.2 L6.6-0.7 L8.2 1.6 L5.6 2.6 L5.4 5.4 L2.6 4.8 L0.7 7 L-0.7 4.8 L-3.5 5.4 L-3.7 2.6 L-6.3 1.6 L-4.7-0.7 L-5.9-3.2 L-3.3-4.2 L-2.9-7 L-0.2-6.4 Z"/>
    <circle cx="0" cy="0" r="3.4" fill="#DBEAFE" stroke="#1E3A8A" stroke-width="0.9"/>
    <path fill="#1E3A8A" d="M0-2.1 L0.55-0.55 L2.2-0.45 L0.9 0.55 L1.25 2.15 L0 1.3 L-1.25 2.15 L-0.9 0.55 L-2.2-0.45 L-0.55-0.55 Z"/>
    <path fill="#60A5FA" stroke="#1E3A8A" stroke-width="0.85" stroke-linejoin="round"
      d="M-2.4 6.2 L-3.6 11.2 L-1.2 10 L0 12.2 L1.2 10 L3.6 11.2 L2.4 6.2 Z"/>
  </g>
</svg>
