<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 424" width="300" height="424" fill="none" role="img" aria-label="Nível 3: Crítico — Quebrado / Trincado">
  <title>Nível 3: Crítico — Quebrado / Trincado</title>
  <defs>
    <linearGradient id="s3-pill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fb7185"/>
      <stop offset="0.5" stop-color="#e11d48"/>
      <stop offset="1" stop-color="#9f1239"/>
    </linearGradient>

    <!-- aro metálico -->
    <linearGradient id="s3-ring" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#f1f5f9"/>
      <stop offset="0.35" stop-color="#94a3b8"/>
      <stop offset="0.7" stop-color="#475569"/>
      <stop offset="1" stop-color="#cbd5e1"/>
    </linearGradient>
    <!-- vidro trincado -->
    <radialGradient id="s3-glass" cx="0.38" cy="0.3" r="0.75">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="0.35" stop-color="#dbeafe"/>
      <stop offset="0.72" stop-color="#93c5fd"/>
      <stop offset="1" stop-color="#475569"/>
    </radialGradient>
    <radialGradient id="s3-impact" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#020617"/>
      <stop offset="0.55" stop-color="#0f172a" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="s3-gloss" cx="0.33" cy="0.24" r="0.72">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="0.32" stop-color="#ffffff" stop-opacity="0.14"/>
      <stop offset="0.72" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="1" stop-color="#0f172a" stop-opacity="0.4"/>
    </radialGradient>
    <radialGradient id="s3-halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0.72" stop-color="#7dd3fc" stop-opacity="0"/>
      <stop offset="0.92" stop-color="#7dd3fc" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#7dd3fc" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="s3-disc" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="0.55" stop-color="#dbeafe" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#93c5fd" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="s3-disc-side" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bfdbfe" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#60a5fa" stop-opacity="0.35"/>
    </linearGradient>

    <filter id="s3-soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <filter id="s3-pillshadow" x="-30%" y="-60%" width="160%" height="260%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#881337" flood-opacity="0.45"/>
    </filter>
    <filter id="s3-orbshadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#1e3a8a" flood-opacity="0.28"/>
    </filter>

    <clipPath id="s3-clip"><circle cx="150" cy="176" r="76"/></clipPath>
  </defs>

  <!-- ================= PEDESTAL ================= -->
  <g>
    <ellipse cx="150" cy="286" rx="112" ry="30" fill="#93c5fd" opacity="0.28" filter="url(#s3-soft)"/>
    <path d="M38 272 a112 30 0 0 0 224 0 v10 a112 30 0 0 1 -224 0 z" fill="url(#s3-disc-side)"/>
    <ellipse cx="150" cy="272" rx="112" ry="30" fill="url(#s3-disc)"/>
    <ellipse cx="150" cy="272" rx="112" ry="30" fill="none" stroke="#ffffff" stroke-width="2.5" opacity="0.9"/>
    <ellipse cx="150" cy="268" rx="88" ry="23" fill="none" stroke="#e0f2fe" stroke-width="2" opacity="0.85"/>
    <ellipse cx="150" cy="264" rx="64" ry="16" fill="none" stroke="#bae6fd" stroke-width="1.6" opacity="0.7"/>
    <ellipse cx="150" cy="260" rx="40" ry="10" fill="none" stroke="#ffffff" stroke-width="1.2" opacity="0.55"/>
  </g>

  <!-- ================= ESFERA / VIDRO ESTILHAÇADO ================= -->
  <g filter="url(#s3-orbshadow)">
    <circle cx="150" cy="176" r="94" fill="url(#s3-halo)"/>
    <!-- aro metálico -->
    <circle cx="150" cy="176" r="86" fill="url(#s3-ring)"/>
    <circle cx="150" cy="176" r="80" fill="#334155"/>
    <!-- vidro -->
    <circle cx="150" cy="176" r="76" fill="url(#s3-glass)"/>

    <g clip-path="url(#s3-clip)">
      <!-- placas de vidro (fragmentos poligonais) -->
      <g stroke="#0f172a" stroke-width="1.4" stroke-linejoin="round" opacity="0.85">
        <polygon points="150,176 122,120 158,110" fill="#e2e8f0" fill-opacity="0.55"/>
        <polygon points="150,176 158,110 196,126" fill="#cbd5e1" fill-opacity="0.45"/>
        <polygon points="150,176 196,126 222,164" fill="#e2e8f0" fill-opacity="0.4"/>
        <polygon points="150,176 222,164 206,214" fill="#cbd5e1" fill-opacity="0.5"/>
        <polygon points="150,176 206,214 166,242" fill="#e2e8f0" fill-opacity="0.42"/>
        <polygon points="150,176 166,242 122,232" fill="#cbd5e1" fill-opacity="0.5"/>
        <polygon points="150,176 122,232 86,196" fill="#e2e8f0" fill-opacity="0.4"/>
        <polygon points="150,176 86,196 92,142" fill="#cbd5e1" fill-opacity="0.48"/>
        <polygon points="150,176 92,142 122,120" fill="#e2e8f0" fill-opacity="0.42"/>
      </g>

      <!-- trincas radiais principais -->
      <g stroke="#0f172a" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <path d="M150 176 L 122 120 L 112 92"/>
        <path d="M150 176 L 158 110 L 156 84"/>
        <path d="M150 176 L 196 126 L 214 104"/>
        <path d="M150 176 L 222 164 L 248 158"/>
        <path d="M150 176 L 206 214 L 226 236"/>
        <path d="M150 176 L 166 242 L 172 268"/>
        <path d="M150 176 L 122 232 L 106 258"/>
        <path d="M150 176 L 86 196 L 58 202"/>
        <path d="M150 176 L 92 142 L 66 128"/>
      </g>
      <!-- anéis concêntricos de fratura -->
      <g stroke="#0f172a" stroke-width="1.6" stroke-linejoin="round" fill="none" opacity="0.9">
        <polygon points="122,120 158,110 196,126 222,164 206,214 166,242 122,232 86,196 92,142"/>
        <polygon points="112,92 156,84 214,104 248,158 226,236 172,268 106,258 58,202 66,128" stroke-width="1.2" opacity="0.7"/>
        <polygon points="136,150 164,146 182,166 176,196 152,210 128,198 124,168" stroke-width="1.2"/>
      </g>
      <!-- realce branco nas trincas -->
      <g stroke="#ffffff" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" opacity="0.9" fill="none" transform="translate(-1.2,-1.2)">
        <path d="M150 176 L 122 120 L 112 92"/>
        <path d="M150 176 L 158 110 L 156 84"/>
        <path d="M150 176 L 196 126 L 214 104"/>
        <path d="M150 176 L 222 164 L 248 158"/>
        <path d="M150 176 L 206 214 L 226 236"/>
        <path d="M150 176 L 166 242 L 172 268"/>
        <path d="M150 176 L 122 232 L 106 258"/>
        <path d="M150 176 L 86 196 L 58 202"/>
        <path d="M150 176 L 92 142 L 66 128"/>
        <polygon points="122,120 158,110 196,126 222,164 206,214 166,242 122,232 86,196 92,142"/>
      </g>

      <!-- cratera de impacto -->
      <circle cx="150" cy="176" r="26" fill="url(#s3-impact)"/>
      <polygon points="150,158 162,170 158,186 142,188 136,172" fill="#020617"/>
      <circle cx="150" cy="176" r="7" fill="#000000"/>

      <!-- lascas soltas -->
      <g stroke="#0f172a" stroke-width="0.9" opacity="0.95">
        <polygon points="126,150 138,146 133,159" fill="#f8fafc"/>
        <polygon points="176,152 187,159 174,164" fill="#e2e8f0"/>
        <polygon points="168,202 180,206 167,213" fill="#f1f5f9"/>
        <polygon points="120,196 131,202 118,208" fill="#f8fafc"/>
        <polygon points="152,214 162,222 148,224" fill="#e2e8f0"/>
      </g>

      <circle cx="150" cy="176" r="76" fill="url(#s3-gloss)"/>
    </g>

    <circle cx="150" cy="176" r="76" fill="none" stroke="#0f172a" stroke-width="2" opacity="0.5"/>
    <circle cx="150" cy="176" r="86" fill="none" stroke="#ffffff" stroke-width="3"/>
    <path d="M92 122 A 78 78 0 0 1 208 118" stroke="#ffffff" stroke-width="7" stroke-linecap="round" opacity="0.5" fill="none"/>
  </g>

  <!-- ================= SELO SUPERIOR ================= -->
  <g filter="url(#s3-pillshadow)" transform="rotate(2 150 36)">
    <rect x="40" y="16" width="220" height="40" rx="20" fill="url(#s3-pill)" stroke="#fecdd3" stroke-width="2"/>
    <circle cx="66" cy="36" r="11" fill="#ffffff"/>
    <circle cx="66" cy="36" r="7" fill="#e11d48"/>
    <circle cx="63.5" cy="33" r="2.4" fill="#ffe4e6" opacity="0.9"/>
    <text x="86" y="42" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" letter-spacing="0.6">NÍVEL 3: CRÍTICO</text>
  </g>

  <g fill="#bfdbfe" opacity="0.75">
    <path d="M276 306 l4 10 10 4 -10 4 -4 10 -4 -10 -10 -4 10 -4 z"/>
    <path d="M24 296 l3 7 7 3 -7 3 -3 7 -3 -7 -7 -3 7 -3 z" opacity="0.7"/>
  </g>

  <!-- ================= RÓTULO ================= -->
  <g fill="#1e293b" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="400" letter-spacing="0.4" text-anchor="middle">
    <text x="150" y="358">QUEBRADO /</text>
    <text x="150" y="392">TRINCADO</text>
  </g>
</svg>
