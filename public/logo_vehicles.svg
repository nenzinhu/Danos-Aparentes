<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" width="100%" height="100%">
  <defs>
    <!-- Cyan/Blue Neon Gradient -->
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#00d4ff" />
      <stop offset="100%" stop-color="#0066ff" />
    </linearGradient>

    <!-- Orange Damage Glow Gradient -->
    <linearGradient id="damageOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffaa00" />
      <stop offset="100%" stop-color="#ff3c00" />
    </linearGradient>

    <!-- Glass reflections -->
    <linearGradient id="glassReflect" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#aaf0ff" stop-opacity="0.6" />
      <stop offset="30%" stop-color="#ffffff" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#00d4ff" stop-opacity="0.1" />
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Damage Glow Filter (Orange) -->
    <filter id="damageGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur1" />
      <feGaussianBlur stdDeviation="2" result="blur2" />
      <feMerge>
        <feMergeNode in="blur1" />
        <feMergeNode in="blur2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Ground Shadows / Blue glow reflections -->
  <ellipse cx="450" cy="385" rx="420" ry="15" fill="#00aaff" opacity="0.12" filter="blur(8px)" />
  <ellipse cx="140" cy="385" rx="100" ry="8" fill="#000000" opacity="0.4" filter="blur(4px)" />
  <ellipse cx="280" cy="385" rx="70" ry="6" fill="#000000" opacity="0.4" filter="blur(4px)" />
  <ellipse cx="490" cy="385" rx="150" ry="10" fill="#000000" opacity="0.4" filter="blur(4px)" />
  <ellipse cx="730" cy="385" rx="120" ry="9" fill="#000000" opacity="0.4" filter="blur(4px)" />

  <!-- ==================== 1. AUTOMÓVEL (CAR) ==================== -->
  <g id="vehicle-car" transform="translate(10, 10)">
    <!-- Car body outline (neon cyan) -->
    <path d="M 40,325 
             C 40,312 43,308 55,302 
             C 65,296 75,268 95,258 
             C 115,248 140,246 170,246 
             L 215,250 
             C 240,256 250,285 260,296 
             C 270,305 272,310 272,322 
             L 272,335 
             C 272,342 268,344 260,344 
             L 52,344 
             C 43,344 40,342 40,335 Z" 
          fill="none" 
          stroke="url(#neonCyan)" 
          stroke-width="5" 
          stroke-linecap="round" 
          stroke-linejoin="round" 
          filter="url(#neonGlow)" />

    <!-- Car bumper, side panels and trim lines -->
    <path d="M 42,328 L 270,328" fill="none" stroke="url(#neonCyan)" stroke-width="2.5" opacity="0.5" />
    <path d="M 52,303 C 82,305 130,308 260,298" fill="none" stroke="url(#neonCyan)" stroke-width="2" opacity="0.6" />

    <!-- Car Windows & Windshield -->
    <path d="M 98,264 
             C 100,264 125,252 165,252 
             L 205,256 
             C 215,258 228,272 233,285 
             L 95,285 Z" 
          fill="url(#glassReflect)" 
          stroke="url(#neonCyan)" 
          stroke-width="3.5" 
          stroke-linecap="round" 
          stroke-linejoin="round" />
    
    <!-- Window divider -->
    <path d="M 160,252 L 160,285" fill="none" stroke="url(#neonCyan)" stroke-width="2.5" />

    <!-- Headlight -->
    <path d="M 41,316 C 47,316 53,322 51,326" fill="none" stroke="#ffffff" stroke-width="3" filter="url(#neonGlow)" />
    <!-- Taillight -->
    <path d="M 271,316 C 265,316 259,322 261,326" fill="none" stroke="#ff3366" stroke-width="3" filter="url(#neonGlow)" />

    <!-- Wheels (Sports rims and tires) -->
    <!-- Front Wheel -->
    <circle cx="85" cy="344" r="24" fill="#020617" stroke="url(#neonCyan)" stroke-width="4.5" />
    <circle cx="85" cy="344" r="16" fill="none" stroke="url(#neonCyan)" stroke-width="2.5" />
    <circle cx="85" cy="344" r="6" fill="#00d4ff" />
    <!-- Spokes -->
    <path d="M 85,324 L 85,364 M 65,344 L 105,344 M 71,330 L 99,358 M 71,358 L 99,330" fill="none" stroke="url(#neonCyan)" stroke-width="2" />

    <!-- Rear Wheel -->
    <circle cx="220" cy="344" r="24" fill="#020617" stroke="url(#neonCyan)" stroke-width="4.5" />
    <circle cx="220" cy="344" r="16" fill="none" stroke="url(#neonCyan)" stroke-width="2.5" />
    <circle cx="220" cy="344" r="6" fill="#00d4ff" />
    <!-- Spokes -->
    <path d="M 220,324 L 220,364 M 200,344 L 240,344 M 206,330 L 234,358 M 206,358 L 234,330" fill="none" stroke="url(#neonCyan)" stroke-width="2" />

    <!-- ORANGE DAMAGE GLOW (Electric crack lines on side doors) -->
    <g filter="url(#damageGlow)">
      <path d="M 125,322 L 138,310 L 148,328 L 165,314 L 178,332 L 195,316" 
            fill="none" 
            stroke="url(#damageOrange)" 
            stroke-width="3.5" 
            stroke-linecap="round" 
            stroke-linejoin="round" />
      <path d="M 138,310 L 132,298 M 165,314 L 172,295 M 148,328 L 152,338" 
            fill="none" 
            stroke="url(#damageOrange)" 
            stroke-width="2" 
            stroke-linecap="round" />
    </g>
  </g>

  <!-- ==================== 2. MOTOCICLETA (MOTORCYCLE) ==================== -->
  <g id="vehicle-moto" transform="translate(10, 10)">
    <!-- Main Frame / Body outline -->
    <path d="M 315,312 
             L 345,268 
             L 370,250 
             L 395,248 
             C 405,248 410,252 408,260 
             L 392,305 
             L 420,328 
             L 410,344" 
          fill="none" 
          stroke="url(#neonCyan)" 
          stroke-width="4.5" 
          stroke-linecap="round" 
          stroke-linejoin="round" 
          filter="url(#neonGlow)" />
    
    <!-- Fairing & Windshield -->
    <path d="M 390,230 
             C 392,218 398,212 405,214 
             L 412,236 
             L 386,248 Z" 
          fill="url(#glassReflect)" 
          stroke="url(#neonCyan)" 
          stroke-width="3.5" 
          stroke-linejoin="round" />
    
    <!-- Fuel Tank & Seat line -->
    <path d="M 345,268 C 362,260 382,260 395,248" fill="none" stroke="url(#neonCyan)" stroke-width="3.5" />
    <path d="M 315,312 C 322,292 338,284 345,268" fill="none" stroke="url(#neonCyan)" stroke-width="3" />

    <!-- Front Fork & Handlebar -->
    <path d="M 405,214 L 430,340" fill="none" stroke="url(#neonCyan)" stroke-width="4" stroke-linecap="round" />
    <path d="M 395,218 L 412,216" fill="none" stroke="url(#neonCyan)" stroke-width="4" stroke-linecap="round" />

    <!-- Rear Swingarm -->
    <path d="M 345,298 L 310,340" fill="none" stroke="url(#neonCyan)" stroke-width="4.5" />

    <!-- Wheels -->
    <!-- Rear Wheel -->
    <circle cx="310" cy="340" r="26" fill="#020617" stroke="url(#neonCyan)" stroke-width="5" />
    <circle cx="310" cy="340" r="16" fill="none" stroke="url(#neonCyan)" stroke-width="2.5" />
    <!-- Front Wheel -->
    <circle cx="430" cy="340" r="26" fill="#020617" stroke="url(#neonCyan)" stroke-width="5" />
    <circle cx="430" cy="340" r="16" fill="none" stroke="url(#neonCyan)" stroke-width="2.5" />

    <!-- ORANGE DAMAGE GLOW (Impact cracks on fairing) -->
    <g filter="url(#damageGlow)">
      <path d="M 378,266 L 388,276 L 382,284 M 388,276 L 396,274" 
            fill="none" 
            stroke="url(#damageOrange)" 
            stroke-width="3" 
            stroke-linecap="round" 
            stroke-linejoin="round" />
    </g>
  </g>

  <!-- ==================== 3. CAMINHÃO (TRUCK) ==================== -->
  <g id="vehicle-truck" transform="translate(10, 10)">
    <!-- Cargo Box (Left/Back part of truck) -->
    <rect x="460" y="160" width="190" height="175" rx="6" 
          fill="none" 
          stroke="url(#neonCyan)" 
          stroke-width="5.5" 
          stroke-linecap="round" 
          stroke-linejoin="round" 
          filter="url(#neonGlow)" />
    
    <!-- Cargo box design details (horizontal panels) -->
    <line x1="460" y1="205" x2="650" y2="205" stroke="url(#neonCyan)" stroke-width="2" opacity="0.6" />
    <line x1="460" y1="250" x2="650" y2="250" stroke="url(#neonCyan)" stroke-width="2" opacity="0.6" />
    <line x1="460" y1="295" x2="650" y2="295" stroke="url(#neonCyan)" stroke-width="2" opacity="0.6" />

    <!-- Cabin (Front part of truck) -->
    <path d="M 650,205 
             L 700,205 
             C 715,205 722,215 726,225 
             L 738,265 
             C 741,275 741,290 741,310 
             L 741,335 
             L 650,335 Z" 
          fill="none" 
          stroke="url(#neonCyan)" 
          stroke-width="5" 
          stroke-linecap="round" 
          stroke-linejoin="round" 
          filter="url(#neonGlow)" />
    
    <!-- Cabin Window / Windshield -->
    <path d="M 662,218 
             L 695,218 
             C 702,218 706,224 708,230 
             L 716,260 
             L 662,260 Z" 
          fill="url(#glassReflect)" 
          stroke="url(#neonCyan)" 
          stroke-width="3.5" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

    <!-- Bumper & Steps -->
    <path d="M 741,320 L 747,320 L 747,332 L 738,332" fill="none" stroke="url(#neonCyan)" stroke-width="3.5" />
    <line x1="650" y1="315" x2="732" y2="315" stroke="url(#neonCyan)" stroke-width="2.5" opacity="0.7" />

    <!-- Wheels (Double rear wheels + single front wheel) -->
    <!-- Rear Wheel 1 -->
    <circle cx="505" cy="342" r="25" fill="#020617" stroke="url(#neonCyan)" stroke-width="5" />
    <circle cx="505" cy="342" r="14" fill="none" stroke="url(#neonCyan)" stroke-width="2.5" />
    <circle cx="505" cy="342" r="5" fill="#00d4ff" />
    <!-- Rear Wheel 2 -->
    <circle cx="575" cy="342" r="25" fill="#020617" stroke="url(#neonCyan)" stroke-width="5" />
    <circle cx="575" cy="342" r="14" fill="none" stroke="url(#neonCyan)" stroke-width="2.5" />
    <circle cx="575" cy="342" r="5" fill="#00d4ff" />
    <!-- Front Cabin Wheel -->
    <circle cx="700" cy="342" r="25" fill="#020617" stroke="url(#neonCyan)" stroke-width="5" />
    <circle cx="700" cy="342" r="14" fill="none" stroke="url(#neonCyan)" stroke-width="2.5" />
    <circle cx="700" cy="342" r="5" fill="#00d4ff" />

    <!-- ORANGE DAMAGE GLOW (Electric arcs on cabin door) -->
    <g filter="url(#damageGlow)" transform="translate(620, 240)">
      <path d="M 40,40 L 52,28 L 60,42 L 75,30 M 52,28 L 48,15 M 60,42 L 64,52" 
            fill="none" 
            stroke="url(#damageOrange)" 
            stroke-width="3.5" 
            stroke-linecap="round" 
            stroke-linejoin="round" />
    </g>
  </g>

  <!-- ==================== 4. ÔNIBUS (BUS) ==================== -->
  <g id="vehicle-bus" transform="translate(10, 10)">
    <!-- Main Bus Body -->
    <path d="M 770,172 
             C 770,165 775,160 782,160 
             L 870,160 
             C 876,160 882,166 884,175 
             L 888,280 
             C 889,295 889,310 889,328 
             L 889,335 
             C 889,341 885,343 878,343 
             L 780,343 
             C 772,343 770,341 770,335 Z" 
          fill="none" 
          stroke="url(#neonCyan)" 
          stroke-width="5.5" 
          stroke-linecap="round" 
          stroke-linejoin="round" 
          filter="url(#neonGlow)" />

    <!-- Bus Windshield (Front) -->
    <path d="M 883,170 
             L 887,230 
             L 856,230 
             L 856,170 Z" 
          fill="url(#glassReflect)" 
          stroke="url(#neonCyan)" 
          stroke-width="3.5" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

    <!-- Bus Side Windows -->
    <!-- Window 1 -->
    <rect x="778" y="172" width="22" height="28" rx="2" fill="url(#glassReflect)" stroke="url(#neonCyan)" stroke-width="2.5" />
    <!-- Window 2 -->
    <rect x="804" y="172" width="22" height="28" rx="2" fill="url(#glassReflect)" stroke="url(#neonCyan)" stroke-width="2.5" />
    <!-- Window 3 -->
    <rect x="830" y="172" width="22" height="28" rx="2" fill="url(#glassReflect)" stroke="url(#neonCyan)" stroke-width="2.5" />

    <!-- Body side divider strip -->
    <line x1="770" y1="245" x2="888" y2="245" stroke="url(#neonCyan)" stroke-width="3" opacity="0.7" />
    <line x1="770" y1="315" x2="888" y2="315" stroke="url(#neonCyan)" stroke-width="2" opacity="0.5" />

    <!-- Headlights & Taillights -->
    <circle cx="887" cy="305" r="4" fill="#ffffff" filter="url(#neonGlow)" />
    <circle cx="771" cy="305" r="3" fill="#ff3366" filter="url(#neonGlow)" />

    <!-- Wheels -->
    <!-- Rear Wheel -->
    <circle cx="798" cy="342" r="23" fill="#020617" stroke="url(#neonCyan)" stroke-width="5" />
    <circle cx="798" cy="342" r="13" fill="none" stroke="url(#neonCyan)" stroke-width="2.5" />
    <!-- Front Wheel -->
    <circle cx="858" cy="342" r="23" fill="#020617" stroke="url(#neonCyan)" stroke-width="5" />
    <circle cx="858" cy="342" r="13" fill="none" stroke="url(#neonCyan)" stroke-width="2.5" />

    <!-- ORANGE DAMAGE GLOW (Cracks at rear/side panel of the bus) -->
    <g filter="url(#damageGlow)" transform="translate(805, 255)">
      <path d="M 0,0 L 10,12 L 5,22 M 10,12 L 20,6" 
            fill="none" 
            stroke="url(#damageOrange)" 
            stroke-width="3" 
            stroke-linecap="round" 
            stroke-linejoin="round" />
    </g>
  </g>
</svg>
