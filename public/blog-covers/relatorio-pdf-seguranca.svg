<svg viewBox="0 0 828 352" width="828" height="352" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Laudo em PDF com selo de segurança, hash e QR Code">
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f3f6fb"/>
      <stop offset="1" stop-color="#dde5f0"/>
    </linearGradient>
    <linearGradient id="header" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e3a5f"/>
    </linearGradient>
    <linearGradient id="badge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fb923c"/>
      <stop offset="1" stop-color="#9e4428"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffb938" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffb938" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000" flood-opacity="0.38"/>
    </filter>
  </defs>

  <ellipse cx="430" cy="185" rx="230" ry="150" fill="url(#glow)"/>

  <g transform="rotate(-5 414 176)" filter="url(#soft)">
    <path d="M310 46 H478 L522 90 V306 A10 10 0 0 1 512 316 H310 A10 10 0 0 1 300 306 V56 A10 10 0 0 1 310 46 Z" fill="url(#card)"/>
    <path d="M478 46 V80 A10 10 0 0 0 488 90 H522 Z" fill="#c3cede"/>

    <rect x="300" y="46" width="222" height="40" rx="10" fill="url(#header)"/>
    <rect x="300" y="66" width="222" height="20" fill="url(#header)"/>
    <rect x="322" y="58" width="120" height="7" rx="3.5" fill="#ffffff" opacity="0.92"/>
    <rect x="322" y="72" width="80" height="5" rx="2.5" fill="#7dd3fc" opacity="0.85"/>

    <rect x="322" y="112" width="178" height="7" rx="3.5" fill="#94a3b8"/>
    <rect x="322" y="130" width="150" height="7" rx="3.5" fill="#94a3b8"/>
    <rect x="322" y="148" width="164" height="7" rx="3.5" fill="#94a3b8"/>
    <rect x="322" y="166" width="110" height="7" rx="3.5" fill="#cbd5e1"/>

    <rect x="322" y="196" width="178" height="1.5" fill="#c3cede"/>

    <g font-family="monospace" font-size="11" fill="#1e3a5f" opacity="0.85">
      <text x="322" y="222">SHA-256</text>
      <text x="322" y="238">0DF2 0434 8A11 CE90</text>
    </g>

    <g transform="translate(322 254)">
      <rect x="0" y="0" width="46" height="46" rx="4" fill="#0f172a"/>
      <g fill="#f3f6fb">
        <rect x="5" y="5" width="10" height="10"/>
        <rect x="31" y="5" width="10" height="10"/>
        <rect x="5" y="31" width="10" height="10"/>
        <rect x="19" y="5" width="4" height="4"/>
        <rect x="19" y="19" width="10" height="10"/>
        <rect x="33" y="19" width="4" height="4"/>
        <rect x="19" y="33" width="4" height="4"/>
        <rect x="27" y="33" width="4" height="10"/>
        <rect x="35" y="35" width="6" height="6"/>
      </g>
    </g>

    <rect x="378" y="256" width="122" height="20" rx="10" fill="#e7edf5" stroke="#c3cede"/>
    <text x="439" y="270" font-family="monospace" font-size="10" fill="#0f766e" text-anchor="middle">verificado ✓</text>
  </g>

  <g transform="translate(492 92)" filter="url(#soft)">
    <circle cx="0" cy="0" r="46" fill="url(#badge)"/>
    <circle cx="0" cy="0" r="46" fill="none" stroke="#ffffff" stroke-opacity="0.25" stroke-width="2"/>
    <path d="M0 -22 L20 -13 V4 C20 18 10 27 0 30 C-10 27 -20 18 -20 4 V-13 Z" fill="none" stroke="#ffffff" stroke-width="3.4" stroke-linejoin="round"/>
    <path d="M-9 1 L-2 9 L11 -8" fill="none" stroke="#ffffff" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <line x1="300" y1="180" x2="522" y2="180" stroke="#38bdf8" stroke-width="2" opacity="0.55" transform="rotate(-5 414 176)"/>
</svg>
