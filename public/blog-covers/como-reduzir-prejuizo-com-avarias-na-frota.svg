<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 828 352" width="828" height="352" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Reduzir prejuízo com avarias na frota com controle e prova">
  <defs>
    <linearGradient id="card-Reduzirpreju" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f0fdf4"/><stop offset="1" stop-color="#dcfce7"/>
    </linearGradient>
    <linearGradient id="header-Reduzirpreju" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#14532d"/><stop offset="1" stop-color="#16a34a"/>
    </linearGradient>
    <linearGradient id="badge-Reduzirpreju" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4ade80"/><stop offset="1" stop-color="#16a34a"/>
    </linearGradient>
    <radialGradient id="glow-Reduzirpreju" cx="0.5" cy="0.5" r="0.5">
