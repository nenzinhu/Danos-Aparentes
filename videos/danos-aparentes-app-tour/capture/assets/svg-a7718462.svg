<svg viewBox="0 0 828 352" width="828" height="352" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Laudo de vistoria para despachantes emitido rapidamente no celular, com envio imediato por QR Code">
  <defs>
    <linearGradient id="phone6" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e1b4b"/>
      <stop offset="1" stop-color="#0f0e28"/>
    </linearGradient>
    <linearGradient id="screen6" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef0fd"/>
      <stop offset="1" stop-color="#dde0fa"/>
    </linearGradient>
    <linearGradient id="header6" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#312e81"/>
      <stop offset="1" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="badge6" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a5b4fc"/>
      <stop offset="1" stop-color="#4f46e5"/>
    </linearGradient>
    <radialGradient id="glow6" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#818cf8" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#818cf8" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft6" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <ellipse cx="410" cy="185" rx="235" ry="150" fill="url(#glow6)"/>

  <!-- Celular com o laudo aberto -->
  <g transform="rotate(-6 380 176)" filter="url(#soft6)">
    <rect x="316" y="30" width="150" height="300" rx="22" fill="url(#phone6)"/>
    <rect x="326" y="52" width="130" height="256" rx="4" fill="url(#screen6)"/>
    <rect x="326" y="52" width="130" height="34" rx="4" fill="url(#header6)"/>
    <rect x="326" y="76" width="130" height="10" fill="url(#header6)"/>
    <circle cx="381" cy="42" r="2.4" fill="#4c4a86"/>

    <text x="336" y="72" font-family="sans-serif" font-weight="800" font-size="10.5" fill="#ffffff">LAUDO · DESPACHANTE</text>

    <g font-family="sans-serif" font-size="9" fill="#312e81">
      <text x="336" y="102">Placa · MKT4322</text>
      <text x="336" y="115" opacity="0.7">Modelo preenchido automático</text>
    </g>

    <g transform="translate(336 128)">
      <rect x="0" y="0" width="118" height="46" rx="6" fill="#ffffff" stroke="#c7cbf5"/>
      <path d="M8 34 L28 12 L46 26 L64 6 L84 20 L110 8" fill="none" stroke="#4f46e5" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="46" cy="26" r="4" fill="#ef4444"/>
    </g>

    <g font-family="sans-serif" font-size="9" fill="#312e81">
      <g transform="translate(336 190)">
        <rect x="0" y="0" width="13" height="13" rx="3.5" fill="#22c55e"/>
        <path d="M2.5 6.5 L5.5 9.5 L10.5 3.5" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="20" y="10.5">Foto com GPS</text>
      </g>
      <g transform="translate(336 210)">
        <rect x="0" y="0" width="13" height="13" rx="3.5" fill="#22c55e"/>
        <path d="M2.5 6.5 L5.5 9.5 L10.5 3.5" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="20" y="10.5">Assinatura na tela</text>
      </g>
    </g>

    <rect x="336" y="234" width="110" height="26" rx="7" fill="#4f46e5"/>
    <text x="391" y="251" font-family="sans-serif" font-weight="700" font-size="9.5" fill="#ffffff" text-anchor="middle">Enviar ao cliente</text>

    <g transform="translate(336 274)">
      <rect x="0" y="0" width="34" height="34" rx="4" fill="#312e81"/>
      <g fill="#eef0fd">
        <rect x="4" y="4" width="8" height="8"/>
        <rect x="22" y="4" width="8" height="8"/>
        <rect x="4" y="22" width="8" height="8"/>
        <rect x="14" y="4" width="3" height="3"/>
        <rect x="14" y="14" width="8" height="8"/>
        <rect x="24" y="14" width="3" height="3"/>
        <rect x="14" y="24" width="3" height="8"/>
      </g>
    </g>
    <text x="376" y="292" font-family="monospace" font-size="8" fill="#312e81" opacity="0.75">hash · SHA-256</text>
  </g>

  <!-- Selo de envio imediato -->
  <g transform="translate(526 90)" filter="url(#soft6)">
    <circle cx="0" cy="0" r="46" fill="url(#badge6)"/>
    <circle cx="0" cy="0" r="46" fill="none" stroke="#ffffff" stroke-opacity="0.3" stroke-width="2"/>
    <path d="M-20 6 L20 -18 L6 20 L-1 4 Z" fill="#ffffff"/>
    <path d="M-1 4 L20 -18 L-9 -6 Z" fill="#e0e7ff"/>
  </g>

  <!-- Traço de velocidade -->
  <g stroke="#a5b4fc" stroke-width="3" stroke-linecap="round" opacity="0.55">
    <line x1="486" y1="150" x2="536" y2="150"/>
    <line x1="486" y1="170" x2="522" y2="170"/>
    <line x1="486" y1="190" x2="512" y2="190"/>
  </g>
</svg>
