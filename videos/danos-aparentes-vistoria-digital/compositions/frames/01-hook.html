<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <!-- head is metadata for the source file only; the runtime ignores it -->
  </head>
  <body>
    <template>
      <style>
        @font-face {
          font-family: "Outfit";
          src: url("capture/assets/fonts/1b99372b3eaef0c8-s.p.1gsd1jahc5dg_.woff2") format("woff2");
          font-weight: 100 900;
          font-style: normal;
          font-display: block;
        }
        @font-face {
          font-family: "IBM Plex Mono";
          src: url("capture/assets/fonts/2fe89d53234c61d4-s.1u30mmyq6lnsd.woff2") format("woff2");
          font-weight: 400;
          font-style: normal;
          font-display: block;
        }

        #root {
          position: absolute;
          inset: 0;
          width: 1920px;
          height: 1080px;
          overflow: hidden;
          background: #e8e6dc;
          container-type: size;
          font-family: "Outfit", sans-serif;
        }

        .ground {
          position: absolute;
          inset: 0;
          background-color: #e8e6dc;
          background-image: linear-gradient(rgba(20, 20, 19, 0.1) 1px, transparent 1px),
            linear-gradient(90deg, rgba(20, 20, 19, 0.1) 1px, transparent 1px);
          background-size: 2cqw 2cqw;
        }

        .hairline {
          position: absolute;
          left: 4cqw;
          right: 4cqw;
          height: 0.12cqw;
          background: #141413;
        }
        .hairline.top {
          top: 3cqw;
        }
        .hairline.bottom {
          /* caption pill owns the bottom ~17% (y > 896px on this 1080-tall canvas) —
             keep the bottom rule inside the safe area instead of the true canvas edge */
          top: 860px;
        }

        .mono-tag {
          position: absolute;
          left: 4cqw;
          top: 4.4cqw;
          font-family: "IBM Plex Mono", monospace;
          font-size: 13px;
          letter-spacing: 0.06em;
          color: #141413;
        }

        .content {
          position: absolute;
          left: 0;
          right: 0;
          top: 0;
          height: 896px;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          gap: 40px;
        }

        .word {
          margin: 0;
          font-family: "Outfit", sans-serif;
          font-weight: 400;
          font-size: 200px;
          line-height: 0.9;
          letter-spacing: -0.008em;
          color: #141413;
          text-align: center;
          transform-origin: center center;
        }

        .question {
          margin: 0;
          max-width: 78cqw;
          font-family: "Outfit", sans-serif;
          font-weight: 400;
          font-size: 88px;
          line-height: 0.95;
          letter-spacing: -0.005em;
          color: #141413;
          text-align: center;
          opacity: 0;
        }

        .question .quote {
          color: rgba(158, 68, 40, 0.18);
        }

        .question .qmark {
          display: inline-block;
        }
      </style>

      <div id="root" data-composition-id="01-hook" data-width="1920" data-height="1080">
        <div class="ground clip" data-start="0" data-duration="3.892" data-track-index="0"></div>
        <div class="hairline top clip" data-start="0" data-duration="3.892" data-track-index="1"></div>
        <div class="hairline bottom clip" data-start="0" data-duration="3.892" data-track-index="2"></div>
        <div class="mono-tag clip" data-start="0" data-duration="3.892" data-track-index="3">01 — HOOK</div>

        <div class="content clip" data-start="0" data-duration="3.892" data-track-index="4">
          <h1 class="word" id="hook-word">Risco.</h1>
          <p class="question" id="hook-question">
            <span class="quote">&ldquo;</span>Sempre<span class="quote">&nbsp;&ldquo;</span>já estava
            aí<span class="quote">&rdquo;</span><span class="qmark" id="hook-qmark">?</span>
          </p>
        </div>
      </div>

      <script>
        window.__timelines = window.__timelines || {};

        const wordEl = document.getElementById("hook-word");
        const questionEl = document.getElementById("hook-question");
        const qmarkEl = document.getElementById("hook-qmark");

        // Sub-shape A: fixed-line token swap, instant hard cuts, no fade/slide.
        const WORD_SEQUENCE = [
          { t: 0.0, text: "Risco." },
          { t: 1.3, text: "Amassado." },
        ];

        function wordAt(time) {
          for (let i = WORD_SEQUENCE.length - 1; i >= 0; i--) {
            if (time >= WORD_SEQUENCE[i].t) return WORD_SEQUENCE[i].text;
          }
          return "";
        }

        const tl = gsap.timeline({ paused: true });

        // Drive the discrete word swap.
        const driver = { t: 0 };
        tl.to(
          driver,
          {
            t: 3.892,
            duration: 3.892,
            ease: "none",
            onUpdate: () => {
              wordEl.textContent = wordAt(driver.t);
            },
          },
          0,
        );

        // Scene 3 (2.6s): word settles smaller at its anchor, question hard-cuts in below it.
        tl.set(wordEl, { scale: 0.62, y: -30 }, 2.6);
        tl.set(questionEl, { opacity: 1 }, 2.6);

        // Sine-wave-loop: low-amplitude jitter on the question mark once settled (t=2.6 → end).
        const IDLE_START = 2.6;
        const IDLE_DUR = 3.892 - IDLE_START;
        const phase = { p: 0 };
        tl.to(
          phase,
          {
            p: Math.PI * 2 * 1.2,
            duration: IDLE_DUR,
            ease: "none",
            onUpdate: () => {
              const rot = Math.sin(phase.p) * 3.5; // degrees, low amplitude
              const scale = 1 + Math.sin(phase.p) * 0.02;
              qmarkEl.style.transform = `rotate(${rot}deg) scale(${scale})`;
            },
          },
          IDLE_START,
        );

        window.__timelines["01-hook"] = tl;
      </script>
    </template>
  </body>
</html>
