<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        @font-face {
          font-family: "Outfit";
          src: url("capture/assets/fonts/1b99372b3eaef0c8-s.p.1gsd1jahc5dg_.woff2") format("woff2");
          font-weight: 100 900;
          font-style: normal;
        }
        @font-face {
          font-family: "IBM Plex Mono";
          src: url("capture/assets/fonts/2fe89d53234c61d4-s.1u30mmyq6lnsd.woff2") format("woff2");
          font-weight: 400;
          font-style: normal;
        }
        @font-face {
          font-family: "IBM Plex Mono";
          src: url("capture/assets/fonts/a7afbb44bec2bb18-s.1qc6dx89jd2qv.woff2") format("woff2");
          font-weight: 500;
          font-style: normal;
        }

        #root {
          position: absolute;
          inset: 0;
          width: 1920px;
          height: 1080px;
          overflow: hidden;
          container-type: size;
          font-family: "Outfit", sans-serif;
        }

        .ground {
          position: absolute;
          inset: 0;
          background-color: #e8e6dc;
          background-image: linear-gradient(rgba(158, 68, 40, 0.1) 1px, transparent 1px),
            linear-gradient(90deg, rgba(158, 68, 40, 0.1) 1px, transparent 1px);
          background-size: 2cqw 2cqw;
        }

        .hairline {
          position: absolute;
          left: 4cqw;
          right: 4cqw;
          height: 0.12cqw;
          background: #141413;
        }
        .hairline-top {
          top: 3cqw;
        }
        .hairline-bottom {
          top: 860px; /* keeps furniture above the 896px / 83% caption keep-out */
        }

        .kicker {
          position: absolute;
          left: 4cqw;
          top: 5.4cqw;
          font-family: "Outfit", sans-serif;
          font-size: 16px;
          font-weight: 600;
          letter-spacing: 0.18em;
          text-transform: uppercase;
          color: #9e4428;
        }

        .page-tag {
          position: absolute;
          right: 4cqw;
          top: 5.4cqw;
          font-family: "IBM Plex Mono", monospace;
          font-size: 13px;
          letter-spacing: 0.06em;
          color: #141413;
        }

        .headline {
          position: absolute;
          left: 4cqw;
          top: 8.6cqw;
          font-family: "Outfit", sans-serif;
          font-weight: 400;
          font-size: 4.6cqw;
          line-height: 0.95;
          letter-spacing: -0.008em;
          color: #141413;
          margin: 0;
        }

        .topbar-rule {
          position: absolute;
          left: 4cqw;
          right: 4cqw;
          top: 18.2cqw;
          border-bottom: 0.12cqw solid #141413;
        }

        .row-surface {
          position: absolute;
          left: 4cqw;
          right: 4cqw;
          top: 22cqh;
          height: 41.6cqh;
          overflow: hidden;
        }

        .burst-wrap {
          position: absolute;
          inset: 0;
        }

        .card {
          position: absolute;
          top: 50%;
          left: 50%;
          width: 29.3cqw;
          height: 41.6cqh;
          background: #e8e6dc;
          border: 0.12cqw solid #141413;
          box-sizing: border-box;
          padding: 2cqw;
          will-change: transform, opacity;
        }

        .card-num {
          font-family: "IBM Plex Mono", monospace;
          font-size: 13px;
          letter-spacing: 0.06em;
          color: #9e4428;
        }

        .card-icon {
          margin-top: 1.6cqw;
          width: 6.5cqw;
          height: 6.5cqw;
        }

        .card-label {
          margin-top: 1.6cqw;
          font-family: "Outfit", sans-serif;
          font-size: 16px;
          font-weight: 600;
          letter-spacing: 0.16em;
          text-transform: uppercase;
          color: #9e4428;
        }

        .card-value {
          margin-top: 0.6cqw;
          font-family: "Outfit", sans-serif;
          font-weight: 400;
          font-size: 2.1cqw;
          line-height: 1.05;
          color: #141413;
        }

        .card-desc {
          margin-top: 1cqw;
          font-family: "Outfit", sans-serif;
          font-size: 0.83cqw;
          line-height: 1.5;
          color: #141413;
        }

        .qr-glyph rect {
          fill: none;
          stroke: #141413;
          stroke-width: 5;
        }

        .badge {
          position: absolute;
          left: -3cqw;
          top: -3cqw;
          width: 14cqw;
          height: 14cqw;
          opacity: 0;
          z-index: 0;
          object-fit: cover;
        }

        .sweep {
          position: absolute;
          top: 0;
          bottom: 0;
          width: 10cqw;
          background: linear-gradient(105deg, transparent, rgba(20, 20, 19, 0.28), transparent);
          opacity: 0;
          pointer-events: none;
        }
      </style>

      <div id="root" data-composition-id="05-security" data-width="1920" data-height="1080">
        <div class="ground"></div>
        <div class="hairline hairline-top"></div>
        <div class="hairline hairline-bottom"></div>

        <div class="kicker" id="sec-kicker">Segurança do laudo</div>
        <div class="page-tag">005 / LAUDO&#8203;-DIGITAL</div>
        <h1 class="headline" id="sec-headline">Prova técnica</h1>
        <div class="topbar-rule" id="sec-rule"></div>

        <div class="row-surface" id="row-surface">
          <div class="burst-wrap" id="burst-wrap">
            <img class="badge" id="badge" src="assets/og-image.jpg" alt="" />

            <div class="card" id="card-1">
              <div class="card-num">001</div>
              <svg class="card-icon" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M32 6 L54 16 V32 C54 46 44 55 32 58 C20 55 10 46 10 32 V16 Z" stroke="#141413" stroke-width="3" />
              </svg>
              <div class="card-label">Hash</div>
              <div class="card-value">SHA&#8209;256</div>
              <div class="card-desc">Cada laudo gera uma impressão digital única do arquivo.</div>
            </div>

            <div class="card" id="card-2">
              <div class="card-num">002</div>
              <svg class="card-icon qr-glyph" id="qr-icon" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
                <rect x="6" y="6" width="18" height="18" />
                <rect x="40" y="6" width="18" height="18" />
                <rect x="6" y="40" width="18" height="18" />
                <rect x="40" y="40" width="18" height="18" />
              </svg>
              <div class="card-label">QR Code</div>
              <div class="card-value">Verificação</div>
              <div class="card-desc">Um código escaneável confirma a autenticidade na hora.</div>
            </div>

            <div class="card" id="card-3">
              <div class="card-num">003</div>
              <svg class="card-icon" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M32 8 C20 8 12 17 12 28 C12 42 32 58 32 58 C32 58 52 42 52 28 C52 17 44 8 32 8 Z" stroke="#141413" stroke-width="3" />
                <circle cx="32" cy="27" r="7" stroke="#141413" stroke-width="3" />
              </svg>
              <div class="card-label">GPS + hora</div>
              <div class="card-value">Local &amp; horário</div>
              <div class="card-desc">Cada foto carrega coordenadas e o horário exato do registro.</div>
            </div>

            <div class="sweep" id="sweep"></div>
          </div>
        </div>
      </div>

      <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
      <script>
        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });

        // ── header (present from t=0, short design-intent label) ──
        tl.fromTo("#sec-kicker", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0.05);
        tl.fromTo("#sec-headline", { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 0.12);
        tl.fromTo("#sec-rule", { opacity: 0, scaleX: 0.85 }, { opacity: 1, scaleX: 1, duration: 0.5, ease: "power3.out" }, 0.3);

        // ── Scene 1 (0.0–2.0s): card 1 assembles into left slot, "Hash SHA-256" ──
        // center-outward-expansion — cards start at the row's shared center and
        // travel to their slot; card 1's target is the left slot offset.
        tl.fromTo(
          "#card-1",
          { xPercent: -50, yPercent: -50, x: -60, y: 0, scale: 0.6, opacity: 0 },
          { xPercent: -50, yPercent: -50, x: -602, y: 0, scale: 1, opacity: 1, duration: 0.75, ease: "power3.out" },
          0.0,
        );
        // shield-badge asset, dimmed supporting texture behind card 1
        tl.fromTo("#badge", { opacity: 0 }, { opacity: 0.4, duration: 0.8, ease: "power2.out" }, 0.15);

        // ── Scene 2 (2.0–4.0s): card 2 lands center slot, "QR Code de verificação" ──
        tl.fromTo(
          "#card-2",
          { xPercent: -50, yPercent: -50, x: 0, y: 20, scale: 0.6, opacity: 0 },
          { xPercent: -50, yPercent: -50, x: 0, y: 0, scale: 1, opacity: 1, duration: 0.7, ease: "power3.out" },
          2.0,
        );

        // QR glyph self-draw inside card 2, starting once the card has mostly settled
        (function () {
          const rects = document.querySelectorAll("#qr-icon rect");
          rects.forEach((r) => {
            const len = r.getTotalLength ? r.getTotalLength() : 72;
            r.style.strokeDasharray = String(len);
            r.style.strokeDashoffset = String(len);
            r.style.fill = "none";
          });
          rects.forEach((r, i) => {
            tl.to(r, { strokeDashoffset: 0, duration: 0.45, ease: "power2.out" }, 2.35 + i * 0.12);
          });
        })();

        // gentle parallax float on the settled pair (card 1 + card 2), bounded, low-amplitude
        (function () {
          const phase1 = { p: 0 };
          const c1 = document.getElementById("card-1");
          tl.to(
            phase1,
            {
              p: Math.PI * 2 * 1.6,
              duration: 5.9,
              ease: "none",
              onUpdate: () => {
                const s = Math.sin(phase1.p);
                c1.style.transform = `translate(calc(-50% + -602px), calc(-50% + ${(s * 2.2).toFixed(2)}px)) scale(${(1 + s * 0.008).toFixed(4)})`;
              },
            },
            2.7,
          );
          const phase2 = { p: 0 };
          const c2 = document.getElementById("card-2");
          tl.to(
            phase2,
            {
              p: Math.PI * 2 * 1.4,
              duration: 5.9,
              ease: "none",
              onUpdate: () => {
                const s = Math.sin(phase2.p + Math.PI / 2);
                c2.style.transform = `translate(-50%, calc(-50% + ${(s * 2.2).toFixed(2)}px)) scale(${(1 + s * 0.008).toFixed(4)})`;
              },
            },
            2.7,
          );
        })();

        // ── Scene 3 (4.0–6.0s): card 3 lands right slot, "Fotos com GPS e hora certa" ──
        tl.fromTo(
          "#card-3",
          { xPercent: -50, yPercent: -50, x: 60, y: 0, scale: 0.6, opacity: 0 },
          { xPercent: -50, yPercent: -50, x: 602, y: 0, scale: 1, opacity: 1, duration: 0.75, ease: "power3.out" },
          4.0,
        );
        // bounded float for card 3 once it settles
        (function () {
          const phase3 = { p: 0 };
          const c3 = document.getElementById("card-3");
          tl.to(
            phase3,
            {
              p: Math.PI * 2 * 1.0,
              duration: 3.9,
              ease: "none",
              onUpdate: () => {
                const s = Math.sin(phase3.p);
                c3.style.transform = `translate(calc(-50% + 602px), calc(-50% + ${(s * 2.2).toFixed(2)}px)) scale(${(1 + s * 0.008).toFixed(4)})`;
              },
            },
            4.75,
          );
        })();

        // single traveling glow sweep left→right across the resolved row, then HOLD
        tl.fromTo(
          "#sweep",
          { x: -220, opacity: 0 },
          { x: 1980, opacity: 0.28, duration: 0.85, ease: "none" },
          4.7,
        );
        tl.to("#sweep", { opacity: 0, duration: 0.3, ease: "power1.in" }, 5.55);

        window.__timelines["05-security"] = tl;
      </script>
    </template>
  </body>
</html>
