<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <!-- head is metadata only — the HyperFrames runtime clones ONLY <template> contents -->
  </head>
  <body>
    <template>
      <style>
        @font-face {
          font-family: "Outfit";
          src: url("capture/assets/fonts/b2ea385cb5ae8625-s.1spbknb88wd48.woff2")
            format("woff2");
          font-weight: 100 900;
          font-style: normal;
          font-display: block;
        }
        @font-face {
          font-family: "IBM Plex Mono";
          src: url("capture/assets/fonts/2fe89d53234c61d4-s.1u30mmyq6lnsd.woff2")
            format("woff2");
          font-weight: 400;
          font-style: normal;
          font-display: block;
        }

        /* Root — style via #root only (class-on-root rules are dropped at composite scope) */
        #root {
          position: relative;
          width: 1920px;
          height: 1080px;
          overflow: hidden;
          font-family: "Outfit", sans-serif;
          container-type: size;
        }

        .clip {
          position: absolute;
          inset: 0;
        }

        /* ---- ground: paper + permanent graph grid + hairlines ---- */
        #bg-ground {
          background-color: #e8e6dc;
          background-image: linear-gradient(rgba(158, 68, 40, 0.1) 1px, transparent 1px),
            linear-gradient(90deg, rgba(158, 68, 40, 0.1) 1px, transparent 1px);
          background-size: 2cqw 2cqw;
        }
        .hairline {
          position: absolute;
          left: 4cqw;
          right: 4cqw;
          height: 0.12cqw;
          background: #141413;
        }
        .hairline-top {
          top: 3cqw;
        }
        .hairline-bottom {
          bottom: 3cqw;
        }

        /* ---- camera wrap (multi-phase-camera) ---- */
        #camera-wrap {
          overflow: hidden;
        }
        #camera {
          position: absolute;
          inset: 0;
          display: grid;
          place-items: center;
          transform-origin: 50% 50%;
          will-change: transform;
        }
        .stage {
          position: relative;
          width: 100%;
          height: 100%;
        }

        /* ---- Scene 1: "Chega." closing token ---- */
        #chega {
          position: absolute;
          left: 50%;
          top: 20.5cqh;
          transform: translate(-50%, -50%);
          font-family: "Outfit", sans-serif;
          font-weight: 600;
          font-size: 16px;
          letter-spacing: 0.18em;
          text-transform: uppercase;
          color: #141413;
          opacity: 0;
        }

        /* ---- lockup: logo mark + wordmark ---- */
        #lockup {
          position: absolute;
          left: 50%;
          top: 44cqh;
          transform: translate(-50%, -50%);
          display: flex;
          align-items: center;
          gap: 2cqw;
        }
        #logo-mark {
          width: 12.5cqw;
          height: 12.5cqw;
          display: block;
          transform-origin: 50% 50%;
          will-change: transform;
          opacity: 0;
        }
        #wordmark-wrap {
          overflow: hidden;
          clip-path: inset(0 100% 0 0);
        }
        #wordmark {
          font-family: "Outfit", sans-serif;
          font-weight: 400;
          font-size: 2.1cqw;
          line-height: 1.05;
          letter-spacing: -0.005em;
          color: #141413;
          white-space: nowrap;
        }

        /* ---- Scene 3: typed tagline ---- */
        #tagline-wrap {
          position: absolute;
          left: 50%;
          top: 61cqh;
          transform: translateX(-50%);
          display: flex;
          align-items: baseline;
          font-family: "IBM Plex Mono", monospace;
          font-weight: 400;
          font-size: 1.6cqw;
          letter-spacing: 0.03em;
          color: #9e4428;
          white-space: pre;
          min-width: 44cqw;
          justify-content: center;
        }
        #tagline {
          white-space: pre;
        }
        #tag-cursor {
          display: inline-block;
          width: 0.9cqw;
          height: 1.6cqw;
          background: #9e4428;
          margin-left: 0.3cqw;
          vertical-align: -2px;
        }
      </style>

      <div id="root" data-composition-id="03-product-intro" data-width="1920" data-height="1080">
        <div
          id="bg-ground"
          class="clip"
          data-start="0"
          data-duration="5.512"
          data-track-index="0"
        >
          <div class="hairline hairline-top"></div>
          <div class="hairline hairline-bottom"></div>
        </div>

        <div
          id="camera-wrap"
          class="clip"
          data-start="0"
          data-duration="5.512"
          data-track-index="1"
        >
          <div id="camera">
            <div class="stage">
              <div id="chega">Chega.</div>
              <div id="lockup">
                <img
                  id="logo-mark"
                  src="assets/logo-b5d5d7ba.svg"
                  alt="Danos Aparentes"
                />
                <div id="wordmark-wrap"><div id="wordmark">Danos Aparentes</div></div>
              </div>
              <div id="tagline-wrap">
                <span id="tagline"></span><span id="tag-cursor"></span>
              </div>
            </div>
          </div>
        </div>
      </div>

      <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
      <script>
        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });

        const TOTAL_DURATION = 5.512;
        const camera = document.getElementById("camera");

        // --- multi-phase camera: settle (Scene 1-2) -> slow push-in (Scene 3) ---
        const phase = { scale: 0.96 };
        tl.to(phase, { scale: 1.0, duration: 1.0, ease: "power2.out" }, 0.2);
        tl.to(phase, { scale: 1.07, duration: 1.9, ease: "power3.out" }, 3.0);

        const drift = { p: 0 };
        tl.to(
          drift,
          {
            p: Math.PI * 2 * 1.4,
            duration: TOTAL_DURATION,
            ease: "none",
            onUpdate: () => {
              const dx = Math.sin(drift.p) * 4;
              const dy = Math.sin(drift.p * 1.3) * 2.5;
              camera.style.transform = `scale(${phase.scale}) translate(${dx}px, ${dy}px)`;
            },
          },
          0,
        );

        // --- Scene 1 (0.0-1.2s): "Chega." hard-cuts in, small, upper-third ---
        tl.set("#chega", { opacity: 1 }, 0.05);

        // --- Scene 2 (1.2-3.0s): "Chega." fades out as the mark spring-pops in;
        //     wordmark unmasks in beside it ---
        tl.to("#chega", { opacity: 0, duration: 0.4, ease: "power1.out" }, 1.2);

        tl.fromTo(
          "#logo-mark",
          { scale: 0, opacity: 0 },
          { scale: 1, opacity: 1, duration: 0.6, ease: "power3.out" },
          1.3,
        );

        tl.fromTo(
          "#wordmark-wrap",
          { clipPath: "inset(0 100% 0 0)" },
          { clipPath: "inset(0 0% 0 0)", duration: 0.55, ease: "power2.out" },
          1.75,
        );
        tl.fromTo(
          "#wordmark",
          { x: 24 },
          { x: 0, duration: 0.55, ease: "power3.out" },
          1.75,
        );

        // --- Scene 3 (3.0-5.0s): tagline types on beneath the settled lockup ---
        const TAGLINE_FULL = "— o laudo que comprova a si mesmo.";
        const tagEl = document.getElementById("tagline");
        const cursorEl = document.getElementById("tag-cursor");
        const TYPE_START = 3.1;
        const TYPE_DUR = 1.6;
        const len = { v: 0 };
        tl.to(
          len,
          {
            v: TAGLINE_FULL.length,
            duration: TYPE_DUR,
            ease: "none",
            onUpdate: () => {
              tagEl.textContent = TAGLINE_FULL.substring(0, Math.floor(len.v));
            },
          },
          TYPE_START,
        );

        // deterministic caret blink (sin-driven, not CSS) — solid while typing, then blinks
        const blink = { p: 0 };
        const BLINK_START = TYPE_START + TYPE_DUR;
        const BLINK_DUR = TOTAL_DURATION - BLINK_START;
        tl.set("#tag-cursor", { opacity: 1 }, TYPE_START);
        tl.to(
          blink,
          {
            p: Math.PI * 2 * 2.2,
            duration: Math.max(BLINK_DUR, 0.1),
            ease: "none",
            onUpdate: () => {
              cursorEl.style.opacity = Math.sin(blink.p) > 0 ? "1" : "0";
            },
          },
          BLINK_START,
        );

        window.__timelines["03-product-intro"] = tl;
      </script>
    </template>
  </body>
</html>
