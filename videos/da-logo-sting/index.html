<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Danos Aparentes — Logo Sting</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=block"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #020617;
      }
      body {
        font-family: "Inter", "Segoe UI", system-ui, sans-serif;
      }

      #stage {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #020617;
      }

      #scene {
        position: relative;
        width: 100%;
        height: 100%;
      }

      .scene-content {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        width: 100%;
        height: 100%;
        padding: 160px 120px;
        gap: 40px;
        box-sizing: border-box;
      }

      .logo-wrap {
        position: relative;
        width: 360px;
        height: 360px;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 2;
      }

      .glow {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 700px;
        height: 700px;
        transform: translate(-50%, -50%);
        border-radius: 50%;
        background: radial-gradient(circle, rgba(31, 182, 255, 0.38) 0%, rgba(31, 182, 255, 0) 70%);
        z-index: 1;
        pointer-events: none;
      }

      .logo-svg {
        position: relative;
        z-index: 2;
        display: block;
      }

      .product-name {
        position: relative;
        z-index: 2;
        font-size: 66px;
        font-weight: 800;
        letter-spacing: 0.05em;
        color: #e8f4ff;
        text-align: center;
        text-transform: uppercase;
        line-height: 1.1;
      }

      .tagline {
        position: relative;
        z-index: 2;
        font-size: 34px;
        font-weight: 400;
        letter-spacing: 0.02em;
        color: #7a9bbf;
        text-align: center;
        line-height: 1.3;
      }
    </style>
  </head>
  <body>
    <div
      id="stage"
      data-composition-id="da-logo-sting"
      data-start="0"
      data-duration="3.5"
      data-fps="30"
      data-width="1080"
      data-height="1920"
    >
      <div id="scene" class="clip" data-start="0" data-duration="3.5" data-track-index="1">
        <div class="scene-content">
          <div id="logo-wrap" class="logo-wrap">
            <div id="glow" class="glow"></div>
            <svg
              class="logo-svg"
              width="340"
              height="340"
              viewBox="0 0 156 156"
              xmlns="http://www.w3.org/2000/svg"
              role="img"
              aria-label="Danos Aparentes"
            >
              <g transform="translate(0.2, 36.8)">
                <style type="text/css">
                  .cls-0 {fill:#DBF1FF;}
                  .cls-1 {fill:url(#da-icon-g1);stroke:#0B1B30;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;}
                  .cls-2 {fill:none;stroke:#0B1B30;stroke-width:2.779;stroke-linecap:round;stroke-linejoin:round;}
                  .cls-3 {fill:#2EBEEC;stroke:#0A1E33;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;}
                  .cls-4 {fill:none;stroke:#606B78;stroke-width:2.5;stroke-miterlimit:10;}
                  .cls-5 {fill:url(#da-icon-g2);stroke:#0B1B30;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;}
                  .cls-6 {fill:#2FB2EC;stroke:#0B1B30;stroke-width:2.356;stroke-linecap:round;stroke-linejoin:round;}
                  .cls-7 {fill:url(#da-icon-g3);}
                  .cls-8 {opacity:0.4;fill:#FFFFFF;}
                  .cls-9 {fill:url(#da-icon-g4);stroke:#0B1B30;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;}
                </style>
                <linearGradient id="da-icon-g1" x1="12.26" x2="146.1" y1="34.15" y2="34.15" gradientUnits="userSpaceOnUse">
                  <stop stop-color="#2FBCEE" offset="0"/><stop stop-color="#4D8AFE" offset="1"/>
                </linearGradient>
                <path class="cls-1" d="m41.8 24.9c-9.3 1.1-20.4 3.2-26.3 6.6-4.9 3-4.1 5.3-4.4 7.1-1.6 1.1-2 2-0.8 8.3 0.5 0.9-1.7 2.4-0.3 3.9 0.5 0.7 1.5 0.7 2.2 0.8 3.4 0.5 8.2 0.8 12.8 0.7l20.1-12.3-3.3-15.1zm11.2-4.3c11.8-6.8 18.7-11.3 31-11.3 17.6 0 24.4-0.3 35.4 4.3 3.6 1.6 8.6 4.1 10.5 5.5 1.1 0.5 1.4 0.8 3 1 4.2 0.6 8.7 1.3 9.8 2.3 1.9 4.8-1.4 7.1 1.7 10.5 0.5 0.6 1 1.4 1.1 2.5 0.5 2 0.5 5.2 0.1 9.7-0.6 4.3-3.8 3.8-10.5 4.9-4.5 0.6-9.1 1.3-11.2 0.9h-80.9l10-30.3z"/>
                <path class="cls-3" d="m34.2 37.6c-4.2 0.8-9.6 5.3-9.6 11.1s4.3 10.9 9.6 11.6c7.5 0.9 0-22.7 0-22.7z"/>
                <line class="cls-2" x1="48.5" x2="105.4" y1="52.2" y2="52.2"/>
                <path class="cls-4" d="m36.8 36.7c5.2-0.4 12.6 4.3 12.6 11.8 0 5.1-3.5 10.5-8.9 11.7"/>
                <linearGradient id="da-icon-g2" x1="115.1" x2="146.1" y1="47.9" y2="47.9" gradientUnits="userSpaceOnUse">
                  <stop stop-color="#2FBCEE" offset="0"/><stop stop-color="#4D8AFE" offset="1"/>
                </linearGradient>
                <path class="cls-5" d="m117 37.5c11.4-1 26.9 1.9 27.9 8.5 0.9 6.2-4 12.4-14.6 13.5-8.5 0.9-12.3-3.2-13.9-8.7-1.2-4.3-2.4-12.8 0.6-13.3z"/>
                <path class="cls-6" d="m126.9 41.2c-3.6 0.3-8.6 3.6-8.6 8s3.9 8.1 8.6 8.6c6.7 0.6 0-16.6 0-16.6z"/>
                <linearGradient id="da-icon-g3" x1="0" x2="156" y1="20" y2="20" gradientUnits="userSpaceOnUse">
                  <stop stop-color="#2FBCEE" offset="0"/><stop stop-color="#4D8AFE" offset="1"/>
                </linearGradient>
                <path class="cls-7" d="m10 33.9h136v6h-136z" opacity="0"/>
                <path class="cls-8" d="m30 25c2-6 15-16 30-16h40c15 0 25 8 30 16l-4 4h-92z"/>
                <linearGradient id="da-icon-g4" x1="0" x2="80" y1="0" y2="30" gradientUnits="userSpaceOnUse">
                  <stop stop-color="#2FBCEE" offset="0"/><stop stop-color="#4D8AFE" offset="1"/>
                </linearGradient>
                <path class="cls-9" d="m48 12h60c8 0 14 6 16 12l3 8h-95l4-11c2-5 6-9 12-9z"/>
              </g>
            </svg>
          </div>

          <div id="product-name" class="product-name">Danos Aparentes</div>
          <div id="tagline" class="tagline">Vistoria digital de avarias</div>
        </div>
      </div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      const logoWrap = "#logo-wrap";
      const glow = "#glow";
      const productName = "#product-name";
      const tagline = "#tagline";

      // Hide delayed-entrance elements up front (seek-safe: autoAlpha, not opacity+from)
      tl.set([glow, logoWrap, productName, tagline], { autoAlpha: 0 }, 0);

      // 1. Logo settles in: scale + fade from a slight offset
      tl.to(logoWrap, { autoAlpha: 1, duration: 0.01 }, 0.05);
      tl.from(logoWrap, { scale: 0.72, y: 24, duration: 0.75, ease: "power3.out" }, 0.05);

      // Glow bloom behind the logo as it settles, then relaxes to a soft ambient level
      tl.to(glow, { autoAlpha: 1, duration: 0.01 }, 0.05);
      tl.fromTo(
        glow,
        { scale: 0.5, opacity: 0 },
        { scale: 1.15, opacity: 1, duration: 0.5, ease: "power2.out" },
        0.05,
      );
      tl.to(glow, { scale: 1, opacity: 0.42, duration: 0.55, ease: "power2.out" }, 0.55);

      // 2. Product name fades/slides up beneath the logo (slight anticipation overlap)
      tl.to(productName, { autoAlpha: 1, duration: 0.01 }, 0.7);
      tl.from(productName, { y: 24, duration: 0.55, ease: "power3.out" }, 0.7);

      // 3. Tagline fades in last, smaller and muted
      tl.to(tagline, { autoAlpha: 1, duration: 0.01 }, 1.45);
      tl.from(tagline, { y: 16, duration: 0.5, ease: "power3.out" }, 1.45);

      // Hold on the resolved lockup for the remainder (1.95s -> 3.5s, ~1.55s hold)

      window.__timelines["da-logo-sting"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
