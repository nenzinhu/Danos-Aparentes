  </style>

  <div
    id="beat-4-laudo"
    data-composition-id="beat-4-laudo"
    data-width="1080"
    data-height="1920"
    style="width:1080px; height:1920px; position:relative; overflow:hidden; background:#020617;"
  >
    <div class="beat4-camera" id="beat4-camera">
      <div class="beat4-bg-grid" id="beat4-bg-grid"></div>
      <div class="beat4-glow"></div>

      <div class="beat4-doc-wrap">
        <div class="beat4-doc" id="beat4-doc">
          <div class="beat4-eyebrow" id="beat4-eyebrow">Laudo de vistoria &middot; N&ordm; 00482</div>
          <div class="beat4-header" id="beat4-header">ABC-1D23 &middot; Corolla XEi 2022</div>
          <div class="beat4-divider" id="beat4-divider"></div>

          <div class="beat4-damage-row" id="beat4-damage-row">
            <span class="beat4-damage-text">Porta diant. esq. &middot; risco</span>
            <span class="beat4-damage-badge" id="beat4-badge">1 avaria registrada</span>
          </div>

          <div class="beat4-qr-wrap">
            <div class="beat4-qr" id="beat4-qr"></div>

            <svg class="beat4-sig-svg" viewBox="0 0 300 90">
              <path
                id="beat4-sig-path"
                d="M8,62 C 24,18 40,86 58,48 C 72,18 88,76 108,42 C 124,14 142,70 164,38 C 182,12 200,58 224,32 C 242,14 258,48 276,26 C 284,16 288,22 292,16"
                fill="none"
                stroke="#1fb6ff"
                stroke-width="4.5"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
            <span class="beat4-sig-label" id="beat4-sig-label">Assinado digitalmente</span>
          </div>

          <div class="beat4-verified" id="beat4-verified">&#10003; Documento verificado</div>
        </div>
      </div>

  </div>

  <script>
    (function () {
      var BEAT = 6.7; // matches data-duration on host div in index.html
      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });

      var camera = document.getElementById("beat4-camera");
      var bgGrid = document.getElementById("beat4-bg-grid");
      var doc = document.getElementById("beat4-doc");
      var eyebrow = document.getElementById("beat4-eyebrow");
      var header = document.getElementById("beat4-header");
      var divider = document.getElementById("beat4-divider");
      var damageRow = document.getElementById("beat4-damage-row");
      var badge = document.getElementById("beat4-badge");
      var qr = document.getElementById("beat4-qr");
      var hash = document.getElementById("beat4-hash");
      var sigRow = document.getElementById("beat4-sig-row");
      var sigPath = document.getElementById("beat4-sig-path");
      var sigLabel = document.getElementById("beat4-sig-label");
      var verified = document.getElementById("beat4-verified");

      // ---- Build QR module grid (deterministic pseudo-QR, no Math.random) ----
      var QR_SIZE = 16;
      var qrModules = [];

      function inFinderBlock(i, j) {
        return (
          (i < 7 && j < 7) || // top-left
          (i < 7 && j >= QR_SIZE - 7) || // top-right
          (i >= QR_SIZE - 7 && j < 7) // bottom-left
        );
      }

      function finderDark(i, j, blockRow, blockCol) {
        var x = j - blockCol;
        var y = i - blockRow;
        if (x < 0 || x > 6 || y < 0 || y > 6) return false;
        if (x === 0 || x === 6 || y === 0 || y === 6) return true; // outer ring
        if (x >= 2 && x <= 4 && y >= 2 && y <= 4) return true; // inner core
        return false;
      }

      function isDark(i, j) {
        if (i < 7 && j < 7) return finderDark(i, j, 0, 0);
        if (i < 7 && j >= QR_SIZE - 7) return finderDark(i, j, 0, QR_SIZE - 7);
        if (i >= QR_SIZE - 7 && j < 7) return finderDark(i, j, QR_SIZE - 7, 0);
        if (inFinderBlock(i, j)) return false;
        // deterministic pseudo-noise pattern (fixed formula, same every render)
        return (i * 13 + j * 7 + i * j * 3) % 11 < 4;
      }

      if (qr) {
        for (var i = 0; i < QR_SIZE; i++) {
          for (var j = 0; j < QR_SIZE; j++) {
            if (isDark(i, j)) {
              var mod = document.createElement("div");
              mod.className = "beat4-qr-mod";
              mod.style.gridColumnStart = j + 1;
              mod.style.gridRowStart = i + 1;
              qr.appendChild(mod);
              qrModules.push(mod);
            }
          }
        }
      }

      var HASH_STR = "a3f9c…7e21b"; // "a3f9c…7e21b" — realistic truncated hash

      if (
        camera &&
        bgGrid &&
        doc &&
        eyebrow &&
        header &&
        divider &&
        damageRow &&
        badge &&
        qr &&
        hash &&
        sigRow &&
        sigPath &&
        sigLabel &&
        verified
      ) {
        // prep signature path for stroke-draw
        var sigLen = sigPath.getTotalLength();
        gsap.set(sigPath, { strokeDasharray: sigLen, strokeDashoffset: sigLen });

        // ================= CAMERA — continuous motion across the whole beat =================
        // Rack focus reveal: dolly-out 1.08 -> 1.0 as the document settles, then a slow
        // continued drift through the hold for constant parallax motion.
        tl.fromTo(camera, { scale: 1.08 }, { scale: 1.0, duration: 2.6, ease: "power2.out" }, 0);
        tl.to(camera, { scale: 0.98, duration: BEAT - 2.6 - 0.4, ease: "none" }, 2.6);

        // Background blurs as the document snaps into focus (rack focus).
        tl.fromTo(
          bgGrid,
          { filter: "blur(0px)" },
          { filter: "blur(7px)", duration: 0.6, ease: "power2.out" },
          0
        );

        // ================= DOCUMENT ENTRANCE =================
        tl.fromTo(
          doc,
          { scale: 0.92, opacity: 0 },
          { scale: 1.0, opacity: 1, duration: 0.4, ease: "power3.out" },
          0
        );

        // ================= HEADER =================
        tl.fromTo(eyebrow, { opacity: 0 }, { opacity: 1, duration: 0.25, ease: "power2.out" }, 0.45);
        tl.fromTo(header, { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.out" }, 0.55);
        tl.fromTo(divider, { scaleX: 0 }, { scaleX: 1, duration: 0.4, ease: "power2.out" }, 0.7);

        // ================= DAMAGE ROW + SELO =================
        tl.fromTo(
          damageRow,
          { y: 24, opacity: 0 },
          { y: 0, opacity: 1, duration: 0.4, ease: "back.out(1.4)" },
          0.95
        );
        tl.fromTo(
          badge,
          { scale: 0.8, opacity: 0 },
          { scale: 1, opacity: 1, duration: 0.35, ease: "back.out(1.7)" },
          1.1
        );

        // ================= QR CODE — draws module by module =================
        if (qrModules.length) {
          // qrModules only contains the "dark" cells (not a fully populated
          // 16x16 array), so a grid-based stagger would misalign — use a
          // simple ordered stagger instead. Array order already follows the
          // row-major i,j build loop, so modules still sweep top-to-bottom.
          tl.fromTo(
            qrModules,
            { opacity: 0 },
            {
              opacity: 1,
              duration: 0.05,
              stagger: { amount: 0.5, from: "start" },
            },
            1.45
          );
        }

        // ================= HASH — character-by-character reveal =================
        var hashStart = 2.05;
        var hashDuration = 0.6;
        var perChar = hashDuration / HASH_STR.length;
        for (var c = 1; c <= HASH_STR.length; c++) {
          (function (idx) {
            tl.call(
              function () {
                hash.textContent = HASH_STR.slice(0, idx);
              },
              null,
              hashStart + perChar * idx
            );
          })(c);
        }

        // ================= SIGNATURE — stroke-draw + label =================
        tl.fromTo(
          sigRow,
          { opacity: 0 },
          { opacity: 1, duration: 0.2, ease: "power2.out" },
          2.75
        );
        tl.to(sigPath, { strokeDashoffset: 0, duration: 0.7, ease: "power3.out" }, 2.75);
        tl.fromTo(
          sigLabel,
          { x: -12, opacity: 0 },
          { x: 0, opacity: 1, duration: 0.4, ease: "power2.out" },
          2.9
        );

        // ================= VERIFIED PILL =================
        tl.fromTo(
          verified,
          { y: 10, opacity: 0 },
          { y: 0, opacity: 1, duration: 0.35, ease: "power2.out" },
          3.55
        );

        // ================= HOLD — verified glow pulses around the document =================
        var pulseGlow = "0 8px 40px rgba(0,0,0,0.45), 0 0 60px rgba(31,182,255,0.32)";
        var restGlow = "0 8px 40px rgba(0,0,0,0.45), 0 0 0px rgba(31,182,255,0)";
        var pulseStart = 3.7;
        var pulseCycle = 0.85;
        for (var p = 0; p < 3; p++) {
          var t0 = pulseStart + p * pulseCycle;
          tl.to(doc, { boxShadow: pulseGlow, duration: pulseCycle / 2, ease: "sine.inOut" }, t0);
          tl.to(
            doc,
            { boxShadow: restGlow, duration: pulseCycle / 2, ease: "sine.inOut" },
            t0 + pulseCycle / 2
          );
        }

        // ================= EXIT — recede + fade before the hard cut =================
        tl.to(doc, { scale: 0.95, opacity: 0, duration: 0.4, ease: "power2.in" }, BEAT - 0.4);
      }

      window.__timelines["beat-4-laudo"] = tl;
    })();
  </script>
</template>
