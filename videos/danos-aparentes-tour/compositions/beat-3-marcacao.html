  <script>
    (function () {
      var BEAT = 6.0; // MUST match data-duration on the host div in index.html

      var stage = "#stage";
      var carImg = "#carImg";
      var touchDot = "#touchDot";
      var halo1 = "#halo1";
      var halo2 = "#halo2";
      var selectionHighlight = "#selectionHighlight";
      var selectionBorder = "#selectionBorder";
      var glowSignal = "#glowSignal";
      var chip = "#chip";

      // --- Car diagram entrance: 3D tilt settle, 0.0s -> 0.6s ---
      tl.fromTo(
        carImg,
        { rotateY: -8, scale: 0.85, opacity: 1 },
        { rotateY: 0, scale: 1, duration: 0.6, ease: "power3.out" },
        0

      // --- Camera dolly: slow push-in toward the door, 0.0s -> 1.5s ---

      // --- Touch SNAP at the door: fast camera push + point-of-contact pop, 1.5s ---

      tl.fromTo(
        touchDot,
        { scale: 0, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.4, ease: "back.out(2.6)" },
        1.5
      );

        halo1,
        { scale: 1, opacity: 0.5 },
        { scale: 2.2, opacity: 0, duration: 0.6, ease: "power1.out" },
        1.8
      );
      tl.fromTo(
        halo2,
        { scale: 1, opacity: 0.5 },
        { scale: 2.2, opacity: 0, duration: 0.6, ease: "power1.out" },
        2.1
      );

      // --- Door area recolors / selection outline pops, 2.0s -> 2.4s ---

        selectionHighlight,
        { opacity: 0, scale: 0.9 },
        { opacity: 0.85, scale: 1, duration: 0.4, ease: "back.out(1.5)" },
