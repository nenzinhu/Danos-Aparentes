<template>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    @font-face {
      font-family: "IBM Plex Mono";
      src: url("capture/assets/fonts/2fe89d53234c61d4-s.1u30mmyq6lnsd.woff2") format("woff2");
      font-weight: 400;
      font-style: normal;
    }
    @font-face {
      font-family: "IBM Plex Mono";
      src: url("capture/assets/fonts/a7afbb44bec2bb18-s.1qc6dx89jd2qv.woff2") format("woff2");
      font-weight: 500;
      font-style: normal;
    }
    @font-face {
      font-family: "Outfit";
      src: url("capture/assets/fonts/1b99372b3eaef0c8-s.p.1gsd1jahc5dg_.woff2") format("woff2");
      font-weight: 100 900;
      font-style: normal;
    }

    #beat-2-placa {
      font-family: "Outfit", sans-serif;
    }

    .beat2-camera {
      position: absolute;
      inset: 0;
      transform-origin: 50% 50%;
    }

    .beat2-grid {
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(31, 182, 255, 0.055) 1px, transparent 1px),
        linear-gradient(90deg, rgba(31, 182, 255, 0.055) 1px, transparent 1px);
      background-size: 72px 72px;
      opacity: 0.6;
    }

    .beat2-glow {
      position: absolute;
      left: 50%;
      top: 44%;
      width: 1400px;
      height: 1400px;
      transform: translate(-50%, -50%);
      background: radial-gradient(circle, rgba(31, 182, 255, 0.08) 0%, transparent 65%);
      filter: blur(10px);
    }

    .beat2-glow-pulse {
      position: absolute;
      left: 50%;
      top: 44%;
      width: 1000px;
      height: 1000px;
      transform: translate(-50%, -50%);
      background: radial-gradient(circle, rgba(31, 182, 255, 0.35) 0%, transparent 60%);
      filter: blur(20px);
      opacity: 0;
    }

    .beat2-card {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 918px; /* ~85% of 1080 */
      transform: translate(-50%, -50%);
      background: rgba(2, 6, 23, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(0, 190, 255, 0.12);
      border-radius: 20px;
      padding: 56px 48px;
      box-shadow: 0 8px 40px rgba(0, 0, 0, 0.4);
    }

    .beat2-label {
      font-family: "IBM Plex Mono", monospace;
      font-weight: 500;
      font-size: 16px;
      letter-spacing: 0.1em;
      text-transform: uppercase;

    }

    .beat2-field {
      display: flex;
      align-items: center;
      height: 88px;
      border-bottom: 2px solid rgba(0, 190, 255, 0.12);
      padding-bottom: 8px;
    }

    .beat2-plate-text {
      font-family: "IBM Plex Mono", monospace;
      font-weight: 500;
      font-size: 46px;
      letter-spacing: 0.08em;
      color: #1fb6ff;
      white-space: pre;
    }

    .beat2-cursor {
      display: inline-block;
      width: 4px;
      height: 46px;
      background: #1fb6ff;
      margin-left: 6px;
      transform: translateY(4px);
    }

    .beat2-chips {
      display: flex;
      gap: 16px;
      margin-top: 40px;
    }

    .beat2-chip {
      background: rgba(31, 182, 255, 0.12);
      color: #e8f4ff;
      border-radius: 4px;

      font-family: "Outfit", sans-serif;
      font-weight: 500;
      font-size: 24px;
      opacity: 0;
    }
  </style>

  <div
    id="beat-2-placa"
    data-composition-id="beat-2-placa"
    data-width="1080"
    data-height="1920"
    style="width:1080px; height:1920px; position:relative; overflow:hidden; background:#020617;"
  >
    <div class="beat2-camera" id="beat2-camera">
      <div class="beat2-grid"></div>
      <div class="beat2-glow"></div>
      <div class="beat2-glow-pulse" id="beat2-glow-pulse"></div>

      <div class="beat2-card" id="beat2-card">
        <div class="beat2-label">Placa</div>
        <div class="beat2-field">
          <span class="beat2-plate-text" id="beat2-plate-text"></span><span class="beat2-cursor" id="beat2-cursor"></span>
        </div>
        <div class="beat2-chips">
          <div class="beat2-chip" id="beat2-chip-1">Corolla XEi 2022</div>
          <div class="beat2-chip" id="beat2-chip-2">Prata</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    (function () {
      var BEAT = 5.5; // matches data-duration on host div in index.html
      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });

      var camera = document.getElementById("beat2-camera");
      var card = document.getElementById("beat2-card");
      var glowPulse = document.getElementById("beat2-glow-pulse");
      var plateText = document.getElementById("beat2-plate-text");
      var cursor = document.getElementById("beat2-cursor");
      var chip1 = document.getElementById("beat2-chip-1");
      var chip2 = document.getElementById("beat2-chip-2");

      var PLATE = "ABC-1D23";

      if (camera && card && glowPulse && plateText && cursor && chip1 && chip2) {
        // --- Camera: continuous slow dolly-in + drift across the ENTIRE beat ---
        tl.fromTo(
          camera,
          { scale: 1.0, x: 0 },
          { scale: 1.06, x: 4, duration: BEAT, ease: "none" },
          0
        );

        // --- Cursor blink loop (finite, deterministic — no repeat:-1) ---
        // 5.5s beat / 0.25s per blink cycle => 22 cycles
        for (var b = 0; b < 22; b++) {
          var t0 = b * 0.25;
          tl.set(cursor, { opacity: 0 }, t0);
          tl.set(cursor, { opacity: 1 }, t0 + 0.125);
        }

        // --- Card entrance: scale 0.92 -> 1.0, back.out(1.4) ---
        tl.fromTo(
          card,
          { scale: 0.92, opacity: 0 },
          { scale: 1.0, opacity: 1, duration: 0.55, ease: "back.out(1.4)" },
          0.1
        );

        // --- Typing effect: character-by-character reveal of "ABC-1D23" ---
        // Starts 0.3s (after card lands), completes ~1.6s -> 8 chars over 1.3s
        var typeStart = 0.3;
        var typeDuration = 1.3;
        var perChar = typeDuration / PLATE.length;
        for (var i = 1; i <= PLATE.length; i++) {
          (function (idx) {
            tl.call(
              function () {
                plateText.textContent = PLATE.slice(0, idx);
              },
              null,
              typeStart + perChar * idx
            );
          })(i);
        }

        // --- Confirmation glow pulse right after typing completes (~1.6s) ---
        tl.fromTo(
          glowPulse,
          { opacity: 0 },
          { opacity: 1, duration: 0.25, ease: "power2.out" },
          1.6
        ).to(glowPulse, { opacity: 0, duration: 0.55, ease: "power2.in" }, 1.85);

        // --- Chips stagger in, y:24 -> 0, starting right after the pulse ---
        tl.fromTo(
          chip1,
          { y: 24, opacity: 0 },
          { y: 0, opacity: 1, duration: 0.45, ease: "back.out(1.4)" },
          2.0
        );
        tl.fromTo(
          chip2,
          { y: 24, opacity: 0 },
          { y: 0, opacity: 1, duration: 0.45, ease: "back.out(1.4)" },
          2.15
        );

        // --- Hold: card + chips stay on screen, camera keeps drifting (2.6s -> 5.1s) ---

        // --- Exit: card slides up and fades in the last ~0.4s before the hard cut ---
        tl.to(
          card,
          { y: -30, opacity: 0, duration: 0.4, ease: "power2.in" },
          BEAT - 0.4
        );
      }

      window.__timelines["beat-2-placa"] = tl;
    })();
  </script>
</template>
