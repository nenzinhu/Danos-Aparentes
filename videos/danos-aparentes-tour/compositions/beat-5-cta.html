  <script>
    (function () {
      var BEAT = 7.36; // matches data-duration on host div in index.html
      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });

      var camera = document.getElementById("beat5-camera");
      var glowBg = document.getElementById("beat5-glow-bg");
      var doc = document.getElementById("beat5-doc");
      var waWrap = document.getElementById("beat5-wa-wrap");
      var waHalo = document.getElementById("beat5-wa-halo");
      var brandWrap = document.getElementById("beat5-brand-wrap");
      var brandLogo = document.getElementById("beat5-brand-logo");
      var ringCircle = document.getElementById("beat5-ring-circle");
      var tagline = document.getElementById("beat5-tagline");
      var fade = document.getElementById("beat5-fade");
      var chars = document.querySelectorAll("#beat5-wordmark .beat5-char");

      if (
        camera &&
        glowBg &&
        doc &&
        waWrap &&
        waHalo &&
        brandWrap &&
        brandLogo &&
        ringCircle &&
        tagline &&
        fade &&
        chars.length
      ) {
        // ================= Continuous background glow breathing (full beat) =================
        tl.fromTo(
          glowBg,
          { opacity: 0.1 },
          { opacity: 0.18, duration: 1.2, ease: "sine.inOut", repeat: 5, yoyo: true },
          0
        );

        // ================= Document thumbnail: pop in, then fly into WhatsApp =================
        tl.fromTo(doc, { opacity: 0, scale: 0.85 }, { opacity: 1, scale: 1, duration: 0.12, ease: "power1.out" }, 0);

        // travel + shrink toward the WhatsApp icon center (delta computed from doc center -> wa-wrap center)
        // scale 1 -> 0.15, power3.in, 0.5s per STORYBOARD.md motion magnitudes
        tl.to(
          doc,
          { x: 330, y: 360, scale: 0.15, rotation: 8, duration: 0.5, ease: "power3.in" },
          0.12
        );

        // swallowed by the icon
        tl.to(doc, { scale: 0, opacity: 0, duration: 0.13, ease: "power2.in" }, 0.62);

        // ================= WhatsApp icon appears (back.out) then "snap" pulse on receipt =================
        tl.fromTo(
          waWrap,
          { scale: 0, opacity: 0 },
          { scale: 1, opacity: 1, duration: 0.4, ease: "back.out(1.6)" },
          0.1
        );

        // snap pulse timed so the chime.mp3 SFX (fires at beat-local 0.9s per index.html) lands inside it
        tl.to(waWrap, { scale: 1.15, duration: 0.12, ease: "power2.out" }, 0.75);
        tl.to(waWrap, { scale: 1, duration: 0.13, ease: "power2.in" }, 0.87);

        // ================= WhatsApp halo: sustained brand-blue pulse through the hold =================
        tl.fromTo(
          waHalo,
          { opacity: 0.35 },
          { opacity: 0.65, duration: 0.8, ease: "sine.inOut", repeat: 6, yoyo: true },
          1.0
        );

        // ================= Brand icon enters with drawn ring =================
        tl.fromTo(
          brandLogo,
          { scale: 0.5, opacity: 0 },
          { scale: 1, opacity: 1, duration: 0.4, ease: "back.out(1.6)" },
          1.0
        );

        var ringCircumference = 2 * Math.PI * 72; // ~452.39
        tl.set(ringCircle, { strokeDasharray: ringCircumference, strokeDashoffset: ringCircumference }, 1.0);
        tl.to(ringCircle, { strokeDashoffset: 0, duration: 0.5, ease: "power2.out" }, 1.0);

        // ================= Wordmark: letter-by-letter assembly =================
        var wordStart = 1.3;
        var stagger = 0.045;
        chars.forEach(function (ch, i) {
          tl.fromTo(
            ch,
            { opacity: 0, y: 36, scale: 0.6 },
            { opacity: 1, y: 0, scale: 1, duration: 0.4, ease: "back.out(1.8)" },
            wordStart + i * stagger
          );
        });

        // ================= Tagline: fade + slide up =================
        tl.fromTo(
          tagline,
          { opacity: 0, y: 24 },
          { opacity: 1, y: 0, duration: 0.5, ease: "expo.out" },
          1.9
        );

        // ================= Hold (~2.3s -> ~6.8s): glow + halo keep breathing above (no dead air) =================

        // ================= Final push-in, settling on the brand lockup =================
        tl.fromTo(camera, { scale: 1.0 }, { scale: 1.08, duration: 1.5, ease: "power1.out" }, BEAT - 1.5);

        // ================= Fade to black =================
        tl.fromTo(fade, { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.in" }, BEAT - 0.5);
      }

      window.__timelines["beat-5-cta"] = tl;
    })();
  </script>
