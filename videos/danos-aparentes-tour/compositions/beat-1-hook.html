        <div class="bh-camera" id="bh-camera">
          <div class="bh-glow-burst" id="bh-glow-burst"></div>
          <div class="bh-glow-ambient" id="bh-glow-ambient"></div>

          <div class="bh-stack" id="bh-stack">
            <div class="bh-divider" id="bh-divider"></div>
            <div class="bh-headline" id="bh-headline">
              <span class="bh-word" data-word="0"></span><span class="bh-word" data-word="1"></span><span class="bh-word" data-word="2"></span>
            </div>
            <div class="bh-subline" id="bh-subline">PROVA QUE JÁ TAVA ASSIM.</div>
          </div>

      </div>

      <script>
        (function () {
          var BEAT = 4.2; // matches data-duration on the beat-1 host div in index.html
          window.__timelines = window.__timelines || {};

          // Build per-character spans for the headline (word-wrapped so spaces
          // don't collapse and each word can wrap independently).
          var words = ["BATEU", "O", "CARRO?"];
          var wordEls = document.querySelectorAll("#bh-headline .bh-word");
          words.forEach(function (word, wi) {
            var wordEl = wordEls[wi];
            if (!wordEl) return;
            word.split("").forEach(function (ch) {
              var span = document.createElement("span");
              span.className = "bh-char";
              span.textContent = ch;
              wordEl.appendChild(span);
            });
          });

          var chars = document.querySelectorAll("#bh-headline .bh-char");
          var grid = document.getElementById("bh-grid");
          var logo = document.getElementById("bh-logo");
          var camera = document.getElementById("bh-camera");
          var burst = document.getElementById("bh-glow-burst");
          var ambient = document.getElementById("bh-glow-ambient");
          var divider = document.getElementById("bh-divider");
          var subline = document.getElementById("bh-subline");
          var stack = document.getElementById("bh-stack");

          var tl = gsap.timeline({ paused: true });

          // --- Background grid: slow continuous camera drift across the whole beat.
          tl.fromTo(grid, { scale: 1.0 }, { scale: 1.03, duration: BEAT, ease: "none" }, 0);

          // --- 0.0s: radial light burst SLAM at center.
          tl.fromTo(
            burst,
            { scale: 0.3, opacity: 0.4 },
            { scale: 1.4, opacity: 0, duration: 0.25, ease: "expo.out" },
            0
          );

          // --- Ambient glow behind text: fades in as headline arrives, then
          // pulses through the hold.
          tl.fromTo(ambient, { opacity: 0 }, { opacity: 0.15, duration: 0.55, ease: "power2.out" }, 0.35);
          tl.fromTo(
            ambient,
            { opacity: 0.15 },
            { opacity: 0.3, duration: 0.9, ease: "sine.inOut", yoyo: true, repeat: 1 },
            1.8
          );

          // --- Camera push: 1.0 -> 1.05 in the first 0.5s (the punch), then a
          // slower continued drift to 1.06 through the hold.
          tl.fromTo(camera, { scale: 1.0 }, { scale: 1.05, duration: 0.5, ease: "expo.out" }, 0);
          tl.to(camera, { scale: 1.06, duration: 1.8, ease: "none" }, 1.8);

          // --- 0.25s: divider line draws itself.
          tl.fromTo(divider, { scaleX: 0 }, { scaleX: 1, duration: 0.3, ease: "expo.out" }, 0.25);

          // --- 0.35s: logo accent fades in, discreet, top-left.
          tl.fromTo(logo, { opacity: 0 }, { opacity: 0.7, duration: 0.5, ease: "power2.out" }, 0.35);

          // --- 0.35s: headline char-cascade, bottom-up, back-out overshoot.
          tl.fromTo(
            chars,
            { y: 40, opacity: 0, scale: 0.9 },
            { y: 0, opacity: 1, scale: 1, duration: 0.55, ease: "back.out(1.6)", stagger: 0.06 },
            0.35
          );

          // --- 1.2s: subline fades and slides up under the headline.
          tl.fromTo(subline, { y: 20, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: "power2.out" }, 1.2);

          // --- 1.8s-3.6s hold: subtle upward drift on the whole text stack
          // ("breathing" — small enough to read as held stillness, not a jump).
          tl.to(stack, { y: -8, duration: 1.8, ease: "sine.inOut" }, 1.8);

          // --- 3.85s-4.2s: hard exit, diagonal slide + fade, before the cut to beat 2.
          tl.fromTo(
            camera,
            { x: 0, opacity: 1 },
            { x: -60, opacity: 0, duration: 0.35, ease: "power2.in" },
            3.85
          );
          tl.fromTo(
            logo,
            { x: 0, opacity: 0.7 },
            { x: -60, opacity: 0, duration: 0.35, ease: "power2.in" },
            3.85
          );

          window.__timelines["beat-1-hook"] = tl;
        })();
      </script>
