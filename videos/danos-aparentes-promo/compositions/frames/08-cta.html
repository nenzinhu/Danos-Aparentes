        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });

        // ---- Scene 1 (0.0-1.3s): logo condenses from a soft scatter to dead-center ----
        // deterministic index-derived scatter (golden angle), single logo fragment
        // treated as a 1-element depth-scatter-assemble: enters from a soft offset

        const logoFrag = document.getElementById("logo-frag");
        gsap.set(logoFrag, {
          xPercent: -50,
          yPercent: -50,
          x: -18,
          y: 46,
          z: -260,
          rotationX: 22,
          rotationY: -34,
          scale: 0.7,
          opacity: 0,
        });
        tl.to(
          logoFrag,
          {
            x: 0,
            y: 0,
            z: 0,
            rotationX: 0,
            rotationY: 0,
            scale: 1,
            opacity: 1,
            duration: 0.6,
            ease: "power3.out",
          },
          0.0,
        );

        // atmosphere: concentric closing rings bloom in behind the logo as it settles
        tl.fromTo(
          "#ring-1",
          { scale: 0.6, opacity: 0 },
          { scale: 1, opacity: 0.9, duration: 1.0, ease: "power2.out" },
          0.15,
        );
        tl.fromTo(
          "#ring-2",
          { scale: 0.6, opacity: 0 },
          { scale: 1, opacity: 0.6, duration: 1.1, ease: "power2.out" },
          0.25,
        );
        tl.fromTo(
          "#ring-3",
          { scale: 0.6, opacity: 0 },
          { scale: 1, opacity: 0.35, duration: 1.2, ease: "power2.out" },
          0.35,
        );

        // product name types up beneath the logo as the VO says "Danos Aparentes"
        tl.fromTo(
          ".product-name",
          { opacity: 0, y: 16 },
          { opacity: 1, y: 0, duration: 0.55, ease: "power3.out" },
          0.55,
        );

        // ---- Scene 2 (1.3-2.3s): the one solid terracota CTA pill fades+scales in ----
        tl.fromTo(
          ".cta-button",
          { scale: 0, opacity: 0 },
          { scale: 1, opacity: 1, duration: 0.6, ease: "back.out(1.5)" },
          1.3,
        );

        // ---- Scene 3 (2.3-3.5s): "sem cartão" settles; hold; then real fade-to-black exit ----

          ".sub-line",
          { opacity: 0, y: 10 },
          { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" },
          2.3,

        // then — because this is the FINAL frame — a real exit: soft fade to black
        // over the last ~0.5s, no harness transition follows.
        tl.to(".fade-out", { opacity: 1, duration: 0.5, ease: "power2.in" }, 3.0);
