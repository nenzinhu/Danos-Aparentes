      <script>
        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });

        // Scene 1 (0.0–1.3s): card + eyebrow seat centered-upper
        tl.fromTo(
          ".eyebrow",
          { opacity: 0, y: 12 },
          { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" },
          0.0,
        );
        tl.fromTo(

          { opacity: 0, scale: 0.94 },
          { opacity: 1, scale: 1, duration: 0.6, ease: "power3.out" },
          0.15,

        // Scene 2 (1.3–2.6s): plate chars type in one-by-one via a sweep,
        // then Marca/Modelo tags pop in a 2-up row
        const chars = gsap.utils.toArray(".plate-char");
        const CHAR_STAGGER = 0.09;
        chars.forEach((el, i) => {
          tl.fromTo(
            el,
            { opacity: 0 },
            { opacity: 1, duration: 0.18, ease: "power2.out" },
            1.3 + i * CHAR_STAGGER,
          );
        });

        // highlight sweep runs across the field while chars type in (asr-keyword-glow style emphasis on the surface)
        tl.fromTo(
          ".sweep",
          { x: "0%", opacity: 0 },
          { x: "430%", opacity: 1, duration: 1.15, ease: "power1.inOut" },
          1.3,
        );
        tl.to(".sweep", { opacity: 0, duration: 0.2 }, 2.45);

        // Marca / Modelo tags pop (spring-pop-entrance, group, capped stagger)
        const TAG_STAGGER = 0.06;
        tl.fromTo(
          "#tag-marca",
          { scale: 0, opacity: 0, y: 16 },
          { scale: 1, opacity: 1, y: 0, duration: 0.5, ease: "power3.out" },
          2.15,
        );
        tl.fromTo(
          "#tag-modelo",
          { scale: 0, opacity: 0, y: 16 },
          { scale: 1, opacity: 1, y: 0, duration: 0.5, ease: "power3.out" },
          2.15 + TAG_STAGGER,
        );

        // Scene 3 (2.6–4.0s): Cor + Cidade tags complete the 2x2 grid, then hold
        tl.fromTo(
          "#tag-cor",
          { scale: 0, opacity: 0, y: 16 },
          { scale: 1, opacity: 1, y: 0, duration: 0.5, ease: "power3.out" },
          2.7,
